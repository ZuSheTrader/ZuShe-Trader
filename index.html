  );
}

function Portfolio({account,setAccount,showToast,liveEquity,unrealizedTotal,livePrices}){
  const[tab,setTab]=useState('open');
  const[strategyReview,setStrategyReview]=useState([]);
  const[srLoading,setSrLoading]=useState(false);
  const[srBusy,setSrBusy]=useState(null);
  const equity=liveEquity!=null?liveEquity:account.balance;
  const totalReturn=((account.balance-zsStartBal(account))/zsStartBal(account)*100);
  const equityData=zsEquityCurve(account,equity);

  const loadStrategyReview=useCallback(async()=>{
    if(!window.ZuShePaperDB)return;
    setSrLoading(true);
    try{
      const rows=await window.ZuShePaperDB.loadStrategyReview();
      setStrategyReview(rows||[]);
    }catch(err){
      console.warn('[ZuShé Trader] could not load strategy review:',err);
    }finally{
      setSrLoading(false);
    }
  },[]);

  useEffect(()=>{
    let cancelled=false,tries=0;
    const iv=setInterval(()=>{
      tries++;
      if(cancelled)return;
      if(window.ZuShePaperDB||tries>20){
        clearInterval(iv);
        loadStrategyReview();
      }
    },150);
    const refresh=setInterval(loadStrategyReview,60000);
    const onVis=()=>{if(document.visibilityState==='visible')loadStrategyReview();};
    document.addEventListener('visibilitychange',onVis);
    return()=>{cancelled=true;clearInterval(iv);clearInterval(refresh);document.removeEventListener('visibilitychange',onVis);};
  },[loadStrategyReview]);

  const decideStrategy=async(strategy,decision)=>{
    if(!window.ZuShePaperDB)return;
    setSrBusy(strategy+':'+decision);
    try{
      await window.ZuShePaperDB.decideStrategyReview(strategy,decision);
      showToast(decision==='approve'?('🚫 '+strategy+' paused — signal-scan will stop generating it.'):('✅ Kept '+strategy+' active.'),decision==='approve'?'warning':'success');
      await loadStrategyReview();
    }catch(err){
      showToast('Could not update '+strategy+': '+(err?.message||err),'error');
    }finally{
      setSrBusy(null);
    }
  };

  const closePosition=(posId)=>{
    const pos=account.openPositions.find(p=>p.id===posId);
    if(!pos)return;
    let pl,exitPrice,status,grossPl=0,fee=0;
    if(pos.paper){
      // Real paper position (opened by the Paper Engine off live Luno data).
      // Manual close uses the last real fetched price, never a random outcome.
      // Use THIS position's own pair price. (It used to read a single shared
      // "focused pair" price, so closing an LTC/XRP trade could use BTC's price.)
      const last=Number(livePrices&&livePrices[pos.pair]);
      if(!Number.isFinite(last)||last<=0){
        showToast('Waiting for a live '+zsPairAsset(pos.pair)+' price — try again in a few seconds.','warning');return;
      }
      if(Math.abs(last/pos.entry-1)>0.5){
        showToast('Price looks wrong for this trade ('+last+' vs entry '+pos.entry+') — not closing. Try again shortly.','warning');return;
      }
      // A manual close is still a taker order crossing the spread, so apply a
      // small adverse spread estimate to the live tick, then the same
      // round-trip exchange fee TP/SL fills get — this is what makes the
      // saved P/L the same "after real costs" number either way.
      const spreadAdj=1+(ZS_FEE_MODEL.manualSpreadBps/10000)*(pos.dir==='BUY'?-1:1);
      exitPrice=zsRoundPrice(last*spreadAdj);
      grossPl=parseFloat(((pos.dir==='BUY'?(exitPrice-pos.entry):(pos.entry-exitPrice))*(pos.size||0)).toFixed(2));
      fee=zsRoundTripFee(pos.entry,exitPrice,pos.size||0);
      pl=parseFloat((grossPl-fee).toFixed(2));
      status=pl>=0?'Win':'Loss';
    }else{
      // Demo/simulated position from the illustrative signal desk — clearly
      // labelled DEMO MODE elsewhere in the app, not the real paper engine.
      pl=parseFloat(((Math.random()>.45?1:-1)*pos.risk*(1+Math.random()*2)).toFixed(2));
      exitPrice=pos.dir==='BUY'?pos.entry*(1+(pl>0?.008:-.005)):pos.entry*(1-(pl>0?.008:-.005));
      grossPl=pl;fee=0;
      status=pl>0?'Win':'Loss';
    }
    const trade={...pos,exit:parseFloat(exitPrice.toFixed(pos.entry<10?4:2)),pl,grossPl,fee,slip:0,closeTime:new Date().toISOString(),status,trigger:pos.paper?'Manual close':undefined};
    const newBalance=parseFloat((account.balance+pl).toFixed(2));
    const newDailyPL=parseFloat((account.dailyPL+pl).toFixed(2));
    setAccount(a=>({...a,
      balance:newBalance,
      equity:newBalance,
      dailyPL:newDailyPL,
      openPositions:a.openPositions.filter(p=>p.id!==posId),
      closedTrades:[trade,...a.closedTrades],
      used:parseFloat(Math.max(0,a.used-pos.risk).toFixed(2))
    }));
    if(pos.paper){
      zsSettleClose(trade,setAccount);
    }
    showToast((pl>=0?'🟢 Trade closed profit: +':'🔴 Trade closed loss: ')+fmtCur(Math.abs(pl)),pl>=0?'success':'error');
  };

  const wins=account.closedTrades.filter(t=>t.pl>0);
  const losses=account.closedTrades.filter(t=>t.pl<=0);
  const winRate=account.closedTrades.length>0?Math.round(wins.length/account.closedTrades.length*100):0;

  // Split closed trades into the groups the Closed Trades tab shows separately:
  // hit Take-Profit, hit Stop-Loss, or closed by hand (manual / anything else).
  const tpTrades=useMemo(()=>account.closedTrades.filter(t=>zsExitBucket(t)==='tp'),[account.closedTrades]);
  const slTrades=useMemo(()=>account.closedTrades.filter(t=>zsExitBucket(t)==='sl'),[account.closedTrades]);
  const manualTrades=useMemo(()=>account.closedTrades.filter(t=>zsExitBucket(t)==='manual'),[account.closedTrades]);
  const groupStats=(list)=>{
    const gw=list.filter(t=>t.pl>0),gl=list.filter(t=>t.pl<=0);
    const net=list.reduce((s,t)=>s+(Number(t.pl)||0),0);
    return {count:list.length,wins:gw.length,losses:gl.length,net,winRate:list.length?Math.round(gw.length/list.length*100):0};
  };

  // One closed-trade card with everything needed to understand the trade at a
  // glance: direction/pair, P/L + R-multiple, entry->exit, SL/TP, strategy,
  // size, and how long it was open. bucket controls the trigger pill's colour.
  const renderTradeCard=(t,i,bucket)=>{
    const risk=Number(t.risk)||0;
    const rMult=risk>0?(t.pl/risk):null;
    const dur=zsFmtDuration((t.closeTime?new Date(t.closeTime).getTime():Date.now())-(t.openedAt||0));
    const trigLbl=bucket==='tp'?'Take-Profit':bucket==='sl'?'Stop-Loss':(t.trigger||'Manual close');
    const trigCls=bucket==='tp'?'pill-cyan':bucket==='sl'?'pill-watch':'pill-purple';
    return e('div',{key:t.id||'ct_'+i,className:'card card-sm'},
      e('div',{className:'row',style:{marginBottom:6}},
        e('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          e('span',{className:'pill '+(t.dir==='BUY'?'pill-buy':'pill-sell')},t.dir),
          e('span',{style:{fontWeight:700,fontSize:13}},t.market),
          e('span',{className:'pill '+trigCls},trigLbl)
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:15,color:t.pl>=0?'var(--green)':'var(--red)'}},(t.pl>=0?'+':'')+fmtCur(t.pl)),
          e('div',{style:{fontSize:10,color:'var(--text3)'}},rMult!=null?rMult.toFixed(2)+'R':(t.pl>=0?'Profit':'Loss'))
        )
      ),
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)',marginBottom:3}},
        e('span',null,'Entry ',e('span',{style:{fontFamily:'var(--mono)',color:'var(--text2)'}},t.entry)),
        e('span',null,'Exit ',e('span',{style:{fontFamily:'var(--mono)',color:'var(--text2)'}},t.exit))
      ),
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)'}},
        e('span',null,t.strat||t.strategy||'Manual'),
        e('span',null,dur+' · '+(t.closeTime?new Date(t.closeTime).toLocaleDateString([],{day:'2-digit',month:'short'})+' '+new Date(t.closeTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Today'))
      ),
      // Cost breakdown — only shown once a trade actually carries a fee, so
      // older/legacy rows without one don't render a misleading R0.00 line.
      (Number(t.fee)>0||Number(t.slip)>0)&&e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)',marginTop:3,paddingTop:3,borderTop:'1px dashed var(--border)'}},
        e('span',null,'Gross '+(t.grossPl>=0?'+':'')+fmtCur(t.grossPl)+
          (Number(t.slip)>0?' · slip -'+fmtCur(t.slip):'')+
          ' · fee -'+fmtCur(t.fee)
        ),
        e('span',{style:{color:t.pl>=0?'var(--green)':'var(--red)'}},'Net '+(t.pl>=0?'+':'')+fmtCur(t.pl))
      )
    );
  };

  // A titled section for one closed-trade bucket: subtotal header (count,
  // win rate, net P/L) followed by that bucket's cards, oldest-excluded —
  // account.closedTrades already comes sorted newest-first.
  const renderClosedGroup=(key,icon,title,sub,list,bucket,emptyMsg)=>{
    const s=groupStats(list);
    return e('div',{key},
      e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px 6px'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:8}},
          e('span',{style:{fontSize:15}},icon),
          e('div',null,
            e('div',{style:{fontWeight:700,fontSize:13}},title+' ('+s.count+')'),
            e('div',{style:{fontSize:10,color:'var(--text3)'}},sub)
          )
        ),
        s.count>0&&e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:13,color:s.net>=0?'var(--green)':'var(--red)'}},(s.net>=0?'+':'')+fmtCur(s.net)),
          e('div',{style:{fontSize:9,color:'var(--text3)'}},s.winRate+'% win rate')
        )
      ),
      s.count===0
        ?e('div',{style:{padding:'0 12px 14px',fontSize:11,color:'var(--text3)'}},emptyMsg)
        :e('div',{style:{paddingBottom:6}},list.map((t,i)=>renderTradeCard(t,i,bucket)))
    );
  };

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Demo Portfolio'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'YOUR SIMULATED R10,000 ACCOUNT')
      ),
      e('span',{className:'mode-badge badge-demo'},'SIMULATED')
    ),
    e('div',{className:'scroll'},
      e('div',{className:'info-banner',style:{marginTop:8}},
        e('span',null,'💼'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'What is the Demo Portfolio?'),
          'This is your simulated trading account. It starts with R10,000 of virtual money. When you accept a signal, a demo position opens here. When the trade closes (either at Take Profit, Stop Loss, or manually), your balance updates. Nothing here is real money — it is a safe environment to test your decision-making.'
        )
      ),

      // Balance summary
      e('div',{className:'stat-grid',style:{paddingTop:4}},
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},e(HelpLabel,{label:'Balance',help:'Your current demo account balance. This changes every time a trade closes. It started at R10,000 and every win increases it, every loss decreases it.'})),
          e('div',{className:'stat-val stat-neu'},fmtCur(account.balance)),
          e('div',{className:'stat-sub'},'Started at R10,000.00')
        ),
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},e(HelpLabel,{label:"Today's P/L",help:'The total profit or loss from all trades that closed today. This resets every day at midnight. Tracked against your daily loss limit in the Risk Vault.'})),
          e('div',{className:'stat-val '+(account.dailyPL>=0?'stat-up':'stat-dn')},
            (account.dailyPL>=0?'+':'')+fmtCur(account.dailyPL)
          ),
          e('div',{className:'stat-sub'},fmtPct((account.dailyPL/(account.balance||zsStartBal(account)))*100)+' of balance')
        ),
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},e(HelpLabel,{label:'Open Positions',help:'How many demo trades are currently open. Each one has capital tied up as margin. To free up capacity for new signals, you can manually close a position using the Close button.'})),
          e('div',{className:'stat-val stat-neu'},account.openPositions.length),
          e('div',{className:'stat-sub',style:{color:'var(--amber)'}},fmtCur(account.used)+' reserved')
        ),
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},e(HelpLabel,{label:'Total Return',help:'How much your R10,000 account has grown or shrunk since you started. A positive percentage means your demo trading has been profitable overall.'})),
          e('div',{className:'stat-val '+(totalReturn>=0?'stat-up':'stat-dn')},
            (totalReturn>=0?'+':'')+totalReturn.toFixed(2)+'%'
          ),
          e('div',{className:'stat-sub'},'From R10,000 start')
        )
      ),

      // Equity curve
      e('div',{className:'card'},
        e('div',{className:'row',style:{marginBottom:6}},
          e('div',null,
            e('div',{style:{fontWeight:700,fontSize:13}},'Portfolio Equity Curve'),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},'How your balance has changed over time — upward is good')
          ),
          e('span',{style:{fontFamily:'var(--mono)',fontWeight:700,color:'var(--cyan)',fontSize:14}},fmtCur(equity))
        ),
        e('div',{className:'chart-wrap',style:{height:75}},
          e(MiniEquity,{data:equityData,height:75,color:totalReturn>=0?'var(--cyan)':'var(--red)'})
        )
      ),

      e('div',{className:'tabs'},
        [
          {id:'open',lbl:'Open Positions ('+account.openPositions.length+')'},

          {id:'stats',lbl:'Stats & Analysis'},
        ].map(({id,lbl})=>e('button',{key:id,className:'tab '+(tab===id?'on':''),onClick:()=>setTab(id)},lbl))
      ),

              e('div',{className:'empty-icon'},'💼'),
              e('div',{className:'empty-title'},'No open positions'),

            )
          :account.openPositions.map(pos=>{
              const lastPx=livePrices&&livePrices[pos.pair];

              const uPl=uBreak?uBreak.net:null;
              return e('div',{key:pos.id,className:'card'},
              e('div',{className:'row',style:{marginBottom:10}},
                e('div',null,
                  e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:2}},
                    e('span',{className:'pill '+(pos.dir==='BUY'?'pill-buy':'pill-sell')},pos.dir==='BUY'?'▲ BUY':'▼ SELL'),
                    e('span',{style:{fontWeight:800,fontSize:15}},pos.market||zsPairAsset(pos.pair))
                  ),
                  e('div',{style:{fontSize:11,color:'var(--text3)'}},pos.strat||pos.strategy)
                ),
                e('div',{style:{textAlign:'right'}},
                  e('div',{style:{fontSize:10,color:'var(--text3)'}},'At risk'),

                )
              ),

                e('div',null,
                  e('div',{style:{fontSize:9,color:'var(--text3)',marginBottom:2}},'GROSS'),
                  e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:uBreak.gross>=0?'var(--green)':'var(--red)'}},(uBreak.gross>=0?'+':'')+fmtCur(uBreak.gross))

function BacktestArena({strategies}){
  const[selStrat,setSelStrat]=useState(strategies[0]?.id||'');
  const[market,setMarket]=useState('XAUUSD');
  const[tf,setTf]=useState('H4');
  const[period,setPeriod]=useState('6m');
  const[running,setRunning]=useState(false);
  const[result,setResult]=useState(null);
  const[showExplain,setShowExplain]=useState(false);

  const runBacktest=async()=>{
    setRunning(true);setResult(null);
    await new Promise(r=>setTimeout(r,1800));
    const s=strategies.find(x=>x.id===selStrat)||strategies[0];
    const wr=s?s.winRate:55;
    const pf=s?s.pf:1.5;
    const dd=s?s.dd:10;
    const trades=s?s.trades:80;
    const ret=parseFloat(((pf-1)*wr*0.8).toFixed(2));
    const startBal=1000;
    const endBal=Math.round(startBal*(1+ret/100));
    const equity=[startBal];
    for(let i=0;i<20;i++){const v=equity[i]*(1+(Math.random()>.45?.013:-.009));equity.push(Math.round(v));}
    const totalProfit=ret>0?endBal-startBal:0;
    const totalLoss=ret<0?startBal-endBal:Math.round((endBal-startBal)*(.3+Math.random()*.2));
    const isOverfit=dd<8&&wr>68;
    setResult({ret,startBal,endBal,wr,lr:100-wr,pf:pf.toFixed(2),dd:dd.toFixed(1),trades,
      avgDur:'3h 45m',best:320,worst:-180,overfit:isOverfit?'High':'Low',
      rating:s?scoreLabel(s.score):'Promising',equity,
      monthly:[3.2,-1.1,4.5,2.8,-0.9,5.1],
      longWR:wr+3,shortWR:wr-3,
      totalProfit,totalLoss,
      pfExplain:totalLoss>0?(totalProfit/totalLoss).toFixed(2):pf.toFixed(2)});
    setRunning(false);
  };

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Backtest Arena'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'TEST STRATEGIES ON HISTORICAL PRICE DATA')
      )
    ),
    e('div',{className:'scroll'},
      e('div',{className:'info-banner',style:{marginTop:8}},
        e('span',null,'🔬'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'What is Backtesting?'),
          'Backtesting replays a strategy against historical price data to see how it would have performed in the past. If a strategy would have made money over 6 months of past data, it is worth investigating further. Important: past performance does not guarantee future results.'
        )
      ),

      // Config card
      e('div',{className:'card'},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2,marginBottom:14}},'BACKTEST CONFIGURATION'),

        e('div',{style:{marginBottom:12}},
          e('div',{style:{fontSize:12,fontWeight:600,marginBottom:2}},'Which strategy do you want to test?'),
          e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},'Each strategy has different rules. Backtest one at a time to understand its characteristics.'),
          e('select',{className:'inp',value:selStrat,onChange:ev=>setSelStrat(ev.target.value)},
            strategies.map(s=>e('option',{key:s.id,value:s.id},s.name+' '+s.version+' — '+s.status))
          )
        ),

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
          e('div',null,
            e('div',{style:{fontSize:12,fontWeight:600,marginBottom:2}},'Market'),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},'Test on the same market the strategy was built for if possible.'),
            e('select',{className:'inp',value:market,onChange:ev=>setMarket(ev.target.value)},
              MARKETS.map(m=>e('option',{key:m.id,value:m.id},m.name))
            )
          ),
          e('div',null,
            e('div',{style:{fontSize:12,fontWeight:600,marginBottom:2}},'Timeframe'),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},'Use the same timeframe the strategy was designed for.'),
            e('select',{className:'inp',value:tf,onChange:ev=>setTf(ev.target.value)},

            )
          )
        ),

          e('div',{style:{fontSize:12,fontWeight:600,marginBottom:2}},'Historical Test Period'),
          e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},'Longer periods give more reliable results but are slower. 6 months is a good starting point.'),

            )

            :'▶ Run Backtest Now'
        )
      ),

      // Results
      result&&e('div',null,
        e('div',{className:'warn-banner'},
          e('div',{className:'warn-icon'},'⚠️'),
          e('div',{className:'warn-text'},'These are SIMULATED results on historical data. Past performance does not guarantee future results. Always validate with Forward Testing before using a strategy on real money.')
        ),

        e('div',{className:'card'},
          e('div',{className:'row',style:{marginBottom:14}},
            e('div',null,
              e('div',{style:{fontWeight:800,fontSize:16}},strategies.find(s=>s.id===selStrat)?.name||'Strategy'),
              e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:2,fontFamily:'var(--mono)'}},market+' · '+tf+' chart · '+period+' period')
            ),
            e('div',{style:{background:scoreColor(strategies.find(s=>s.id===selStrat)?.score||50)+'18',color:scoreColor(strategies.find(s=>s.id===selStrat)?.score||50),border:'1px solid '+scoreColor(strategies.find(s=>s.id===selStrat)?.score||50)+'44',borderRadius:8,padding:'4px 10px',fontSize:11,fontWeight:700,fontFamily:'var(--mono)',flexShrink:0}},result.rating)
          ),

          // Equity curve
          e('div',{style:{marginBottom:6}},
            e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:4}},'Equity Curve — how R1,000 would have grown (or shrunk) over the test period:'),
            e('div',{className:'chart-wrap',style:{height:90}},e(MiniEquity,{data:result.equity,height:90,color:result.ret>=0?'var(--green)':'var(--red)'}))
          ),
          e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text3)',marginBottom:14}},
            e('span',null,'Start: '+fmtCur(result.startBal)),
            e('span',{style:{color:result.ret>=0?'var(--green)':'var(--red)',fontWeight:700}},'End: '+fmtCur(result.endBal)+' ('+(result.ret>=0?'+':'')+result.ret+'%)'),
          ),

          // Key metrics explained
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}},
            ...[
              {l:'Win Rate',v:result.wr+'%',c:'var(--green)',d:result.wr+'% of the '+result.trades+' historical trades were profitable'},
              {l:'Loss Rate',v:result.lr+'%',c:'var(--red)',d:result.lr+'% of trades were losses'},
              {l:'Profit Factor',v:result.pfExplain,c:'var(--cyan)',d:'Made '+result.pfExplain+'x more in profits than it lost. A value above 1.5 is healthy.'},
              {l:'Max Drawdown',v:result.dd+'%',c:'var(--amber)',d:'The account fell at most '+result.dd+'% from its highest point during the test period'},
              {l:'Total Trades',v:result.trades,c:'var(--text)',d:'More trades = more statistically reliable results. Under 30 trades is unreliable.'},
              {l:'Avg Trade Duration',v:result.avgDur,c:'var(--text)',d:'Average time a position was held open before closing'},
              {l:'Best Single Trade',v:'+'+fmtCur(result.best),c:'var(--green)',d:'The single most profitable trade in the test period'},
              {l:'Worst Single Trade',v:fmtCur(-Math.abs(result.worst)),c:'var(--red)',d:'The single biggest loss in the test period'},
            ].map(({l,v,c,d})=>e('div',{key:l,style:{background:'var(--glass)',borderRadius:8,padding:'8px 10px'}},
              e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:14,color:c}},v),
              e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:2,fontFamily:'var(--mono)',letterSpacing:.5}},l),
              e('div',{style:{fontSize:10,color:'var(--text3)',marginTop:4,lineHeight:1.5}},d)
            ))
          ),

          // Monthly breakdown
          e('div',{style:{marginBottom:12}},
            e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:1.5,marginBottom:8}},'MONTHLY RETURN BREAKDOWN'),
            e('div',{style:{display:'flex',gap:4}},
              result.monthly.map((m,i)=>e('div',{key:i,style:{flex:1,textAlign:'center'}},
                e('div',{style:{background:m>=0?'var(--green-dim)':'var(--red-dim)',border:'1px solid '+(m>=0?'rgba(16,217,122,.2)':'rgba(255,61,90,.2)'),borderRadius:6,padding:'6px 2px'}},
                  e('div',{style:{fontFamily:'var(--mono)',fontSize:10,fontWeight:700,color:m>=0?'var(--green)':'var(--red)'}},(m>=0?'+':'')+m+'%'),
                  e('div',{style:{fontSize:8,color:'var(--text3)',marginTop:2}},['M1','M2','M3','M4','M5','M6'][i])
                )
              ))
            ),
            e('div',{style:{fontSize:10,color:'var(--text3)',marginTop:6}},'Monthly consistency matters — a strategy that makes money every month is more reliable than one with one huge win and many losses.')
          ),

          // Overfitting assessment
          result.overfit==='High'
            ?e('div',{className:'warn-banner',style:{margin:'0'}},
                e('div',{className:'warn-icon'},'⚠️'),
                e('div',{className:'warn-text'},
                  e('div',{style:{fontWeight:700,marginBottom:2}},'High Overfitting Risk Detected'),
                  'This strategy performed exceptionally well in the historical test (high win rate + low drawdown). This combination is suspicious — it may mean the strategy was unintentionally optimised to fit the specific quirks of past data rather than genuine market patterns. Before trusting these results, run a forward test on fresh data it has never seen.'
                )
              )
            :e('div',{style:{background:'var(--green-dim)',border:'1px solid rgba(16,217,122,.2)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--green)',lineHeight:1.5}},
                '✅ Overfitting Risk: Low — Results appear realistic and the strategy did not score suspiciously high. Still recommended to run Forward Testing before deploying to your demo account.'
              )
        )
      )
    )
  );
}

function ForwardTest({strategies,setStrategies,showToast}){
  const fwdStrats=strategies.filter(s=>['Backtest Passed','Forward Testing','Forward Test Passed'].includes(s.status));
  const allOther=strategies.filter(s=>!['Backtest Passed','Forward Testing','Forward Test Passed'].includes(s.status));

  const startForward=(id)=>{
    setStrategies(ss=>ss.map(s=>s.id===id?{...s,status:'Forward Testing',fwdStart:new Date().toISOString().split('T')[0],fwdTrades:0,fwdWR:0,fwdPL:0}:s));
    showToast('Forward test started — strategy will be monitored on live data','success');
  };
  const passForward=(id)=>{
    setStrategies(ss=>ss.map(s=>s.id===id?{...s,status:'Forward Test Passed'}:s));
    showToast('Forward test passed! Strategy is ready to deploy to demo account.','success');
  };
  const failForward=(id)=>{
    setStrategies(ss=>ss.map(s=>s.id===id?{...s,status:'Retired'}:s));
    showToast('Strategy failed forward testing and has been retired.','info');
  };
  const deployDemo=(id)=>{
    setStrategies(ss=>ss.map(s=>s.id===id?{...s,status:'Demo Active'}:s));
    showToast('🚀 Strategy deployed to demo account — it will now generate live signals','success');
  };

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Forward Testing'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'VALIDATE ON DATA THE AI HAS NEVER SEEN')
      )
    ),
    e('div',{className:'scroll'},
      e('div',{className:'info-banner',style:{marginTop:8}},
        e('span',null,'🧪'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'What is Forward Testing?'),
          'Backtesting tests a strategy on old data. Forward testing does the same but on NEW data — price action that happened after the strategy was created. A strategy that passes both tests is significantly more trustworthy. This is the final validation gate before a strategy can generate live signals on your demo account.'
        )
      ),

      e('div',{className:'info-banner',style:{background:'rgba(139,127,255,.05)',borderColor:'rgba(139,127,255,.2)'}},
        e('span',null,'🚦'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'The Path from Idea to Demo Account'),
          e('div',{style:{display:'flex',flexDirection:'column',gap:4,marginTop:4}},
            ...[
              {n:'1',t:'Run Evolution',d:'Generate strategy candidates','c':'var(--text3)'},
              {n:'2',t:'Backtest Passed',d:'Survived historical testing','c':'var(--amber)'},
              {n:'3',t:'Forward Testing',d:'Currently on this screen — validating on fresh data','c':'var(--cyan)'},
              {n:'4',t:'Forward Test Passed',d:'Approved for deployment','c':'var(--green)'},
              {n:'5',t:'Demo Active',d:'Live on your demo account, generating signals','c':'var(--green)'},
            ].map(({n,t,d,c})=>e('div',{key:n,style:{display:'flex',alignItems:'center',gap:8}},
              e('div',{style:{width:20,height:20,borderRadius:10,background:c+'20',border:'1px solid '+c+'50',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:c,flexShrink:0}},n),
              e('div',null,e('span',{style:{fontWeight:600,color:c,fontSize:12}},t+' '),e('span',{style:{fontSize:11,color:'var(--text3)'}},d))
            ))
          )
        )
      ),

      fwdStrats.length===0
        ?e('div',{className:'empty'},
            e('div',{className:'empty-icon'},'🧪'),
            e('div',{className:'empty-title'},'No strategies ready for forward testing'),
            e('div',{className:'empty-sub'},'Run the Evolution Engine and complete a backtest first. Strategies with status "Backtest Passed" will appear here.')
          )
        :fwdStrats.map(s=>e('div',{key:s.id,className:'card'},
            e('div',{className:'row',style:{marginBottom:8}},
              e('div',null,
                e('div',{style:{fontWeight:700,fontSize:14}},s.name),
                e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:2}},s.family+' · '+s.tf+' chart · Built for '+s.market)
              ),
              e('div',{style:{fontSize:11,fontFamily:'var(--mono)',color:statusColor(s.status),fontWeight:700,flexShrink:0}},s.status)
            ),

            e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:10}},
              ...[
                {l:'Backtest Score',v:s.score+'/100',c:scoreColor(s.score),d:'Historical performance score'},
                {l:'Backtest Win Rate',v:s.winRate+'%',c:'var(--green)',d:'Win rate on historical data'},
                {l:'Max Drawdown',v:s.dd.toFixed(1)+'%',c:'var(--red)',d:'Worst historical peak-to-valley drop'},
              ].map(({l,v,c,d})=>e('div',{key:l,style:{background:'var(--glass)',borderRadius:8,padding:'6px 8px',textAlign:'center'}},
                e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:c}},v),
                e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:2}},l),
                e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:1,lineHeight:1.3}},d)
              ))
            ),

            s.status==='Backtest Passed'&&e('div',null,
              e('div',{style:{background:'var(--amber-dim)',border:'1px solid rgba(255,176,32,.2)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--text2)',lineHeight:1.6,marginBottom:10}},
                '📋 This strategy passed historical backtesting. Start a forward test to monitor it on real current market data. During forward testing, ZuShé will generate signals from this strategy but they will be clearly marked "Forward Test" until the strategy is fully approved.'
              ),
              e('button',{className:'btn btn-outline btn-sm',onClick:()=>startForward(s.id)},'▶ Start Forward Test on Live Data')
            ),

            s.status==='Forward Testing'&&e('div',null,
              e('div',{style:{background:'rgba(0,229,204,.05)',border:'1px solid rgba(0,229,204,.18)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--text2)',lineHeight:1.6,marginBottom:10}},
                e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:4}},
                  e('div',{className:'spinner'}),
                  e('span',{style:{fontWeight:600,color:'var(--cyan)'}},'Forward test in progress...')
                ),
                'This strategy is currently being monitored on live market data. Compare how it performs now against its backtest results. Ideally, forward test performance should be at least 60% of the backtest results. If it performs well, mark it Passed. If it collapses, retire it.'
              ),
              e('div',{style:{display:'flex',gap:6}},
                e('button',{className:'btn btn-green btn-sm',onClick:()=>passForward(s.id)},'✓ Mark Forward Test Passed'),
                e('button',{className:'btn btn-red btn-sm',onClick:()=>failForward(s.id)},'✕ Strategy Failed — Retire It')
              )
            ),

            s.status==='Forward Test Passed'&&e('div',null,
              e('div',{style:{background:'var(--green-dim)',border:'1px solid rgba(16,217,122,.2)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--green)',lineHeight:1.6,marginBottom:10}},
                '✅ This strategy passed both backtesting and forward testing. It is cleared for deployment to your demo account. Once deployed, it will start generating live signals that you can accept or reject.'
              ),
              e('button',{className:'btn btn-green',onClick:()=>deployDemo(s.id)},'🚀 Deploy to Demo Account — Start Generating Signals')
            )
          )),

      allOther.filter(s=>s.status==='Demo Active').length>0&&e('div',null,
        e('div',{className:'stit'},'Currently Deployed'),
        allOther.filter(s=>s.status==='Demo Active').map(s=>e('div',{key:s.id,className:'card card-sm'},
          e('div',{className:'row'},
            e('div',null,e('div',{style:{fontWeight:700,fontSize:13}},s.name),e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},s.family+' · '+s.tf)),
            e('div',{style:{display:'flex',alignItems:'center',gap:4}},
              e('span',{className:'live-dot'}),
              e('span',{style:{fontSize:11,fontWeight:700,color:'var(--green)'}},s.status)
            )
          )
        ))
      )
    )
  );
}

function RiskVault({riskSettings,setRiskSettings,account,showToast}){
  const[rs,setRs]=useState(riskSettings);
  const save=()=>{setRiskSettings(rs);showToast('Risk settings saved — rules are now active','success');};
  const killSwitch=()=>{
    if(window.confirm('EMERGENCY KILL SWITCH\n\nThis will immediately block all new trades.\nAre you sure?')){
      showToast('⛔ Kill switch activated — all new trading blocked','error');
    }
  };
  const dailyUsed=account.balance>0?Math.abs(account.dailyPL)/(account.balance/100):0;

  const RuleRow=({label,desc,inputEl})=>e('div',{style:{padding:'12px 14px',borderBottom:'1px solid var(--border)'}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}},
      e('div',{style:{flex:1}},
        e('div',{style:{fontSize:13,fontWeight:600,marginBottom:2}},label),
        e('div',{style:{fontSize:11,color:'var(--text3)',lineHeight:1.5}},desc)
      ),
      e('div',{style:{flexShrink:0}},inputEl)
    )
  );

  const NumInput=({k,min,max,step})=>e('input',{
    style:{width:72,textAlign:'center',padding:'6px 8px',borderRadius:8,border:'1px solid var(--border)',
      background:'var(--glass2)',color:'var(--text)',fontFamily:'var(--mono)',fontSize:13,outline:'none'},
    type:'number',min,max,step:step||1,value:rs[k],
    onChange:ev=>setRs(r=>({...r,[k]:parseFloat(ev.target.value)||0}))
  });

  const Toggle=({k})=>e('label',{className:'sw'},
    e('input',{type:'checkbox',checked:rs[k],onChange:ev=>setRs(r=>({...r,[k]:ev.target.checked}))}),
    e('span',{className:'sw-slider'})
  );

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Risk Vault'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'PROTECT YOUR CAPITAL')
      )
    ),
    e('div',{className:'scroll'},
      e('div',{className:'info-banner',style:{marginTop:8}},
        e('span',null,'🛡️'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'What is the Risk Vault?'),
          'These rules act as a safety system for your demo trading. When a limit is hit, ZuShé will block new trades and alert you. This protects you from overtrading, chasing losses, or letting one bad day destroy your account. All limits are enforced in demo mode.'
        )
      ),

      // Live status
      e('div',{className:'stat-grid',style:{paddingTop:4}},
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},'Daily Loss Used'),
          e('div',{className:'stat-val '+(dailyUsed>rs.maxDailyLoss*.8?'stat-dn':'stat-up')},dailyUsed.toFixed(1)+'%'),
          e('div',{className:'stat-sub'},'Limit: '+rs.maxDailyLoss+'%')
        ),
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},'Open Positions'),
          e('div',{className:'stat-val '+(account.openPositions.length>=rs.maxOpenTrades?'stat-dn':'stat-neu')},account.openPositions.length+' / '+rs.maxOpenTrades),
          e('div',{className:'stat-sub'},'Maximum allowed')
        )
      ),

      // Daily loss bar
      e('div',{className:'card'},
        e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
          e('div',null,
            e('div',{style:{fontWeight:600,fontSize:13}},'Daily Loss Meter'),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:1}},'Resets every day at midnight. If you hit '+rs.maxDailyLoss+'%, new trades are blocked for the rest of the day.')
          ),
          e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:16,color:dailyUsed>rs.maxDailyLoss*.8?'var(--red)':'var(--green)'}},dailyUsed.toFixed(1)+'%')
        ),
        e('div',{className:'prog-wrap',style:{height:12,borderRadius:6}},
          e('div',{className:'prog-fill',style:{
            width:Math.min(100,dailyUsed/rs.maxDailyLoss*100)+'%',
            background:dailyUsed>rs.maxDailyLoss*.8?'var(--red)':dailyUsed>rs.maxDailyLoss*.5?'var(--amber)':'var(--green)',
            borderRadius:6,height:'100%',transition:'width 1s ease'
          }})
        ),
        e('div',{style:{display:'flex',justifyContent:'space-between',marginTop:4}},
          e('span',{style:{fontSize:10,color:'var(--text3)'}},'0%'),
          e('span',{style:{fontSize:10,color:'var(--amber)'}},Math.round(rs.maxDailyLoss*.5)+'% warning'),
          e('span',{style:{fontSize:10,color:'var(--red)'}},rs.maxDailyLoss+'% limit')
        )
      ),

      // Trade risk settings
      e('div',{className:'settings-section'},
        e('div',{className:'settings-hdr'},'Per-Trade Risk Rules'),
        e(RuleRow,{label:'Risk Per Trade (%)',
          desc:'The maximum percentage of your balance to risk on any single trade. R10,000 × 1% = R100 maximum risk per trade. Recommended: 1–2%. Never exceed 5% per trade.',
          inputEl:e(NumInput,{k:'riskPerTrade',min:.1,max:5,step:.1})}),
        e(RuleRow,{label:'Maximum Open Trades at Once',
          desc:'Caps how many positions you can have open simultaneously. This prevents over-exposure. If you have 5 positions and this is set to 5, no new signals can be accepted until one closes.',
          inputEl:e(NumInput,{k:'maxOpenTrades',min:1,max:20})}),
        e(RuleRow,{label:'Max Trades Per Market',
          desc:'Prevents concentration risk. If you have 2 Gold trades open and this is set to 2, no more Gold signals can be accepted until one closes.',
          inputEl:e(NumInput,{k:'maxPerMarket',min:1,max:10})}),
        e(RuleRow,{label:'Max Trades Per Strategy',
          desc:'Limits how many simultaneous positions a single strategy can open. Prevents one strategy from dominating your entire account.',
          inputEl:e(NumInput,{k:'maxPerStrategy',min:1,max:10})})
      ),

      // Loss limits
      e('div',{className:'settings-section'},
        e('div',{className:'settings-hdr'},'Loss Limit Circuit Breakers'),
        e(RuleRow,{label:'Maximum Daily Loss (%)',
          desc:'If your account loses this percentage in a single day, all new trading is blocked until the next day. Example: 3% of R10,000 = R300 maximum daily loss before the circuit breaker trips.',
          inputEl:e(NumInput,{k:'maxDailyLoss',min:.5,max:20,step:.5})}),
        e(RuleRow,{label:'Maximum Weekly Loss (%)',
          desc:'If your account loses this percentage in a week, trading is blocked until the following Monday. Protects you from catastrophic drawdown during a bad week.',
          inputEl:e(NumInput,{k:'maxWeeklyLoss',min:1,max:50})}),
        e(RuleRow,{label:'Maximum Total Drawdown (%)',
          desc:'If your account ever drops this far from its peak balance, all trading is paused and you are required to manually review before resuming. This is your final safety net.',
          inputEl:e(NumInput,{k:'maxDD',min:5,max:50})}),
        e(RuleRow,{label:'Losing Streak Pause (trades)',
          desc:'If you lose this many trades in a row, trading is automatically paused. This prevents emotional over-trading after consecutive losses. You must manually restart after reviewing.',
          inputEl:e(NumInput,{k:'losingStreak',min:1,max:10})})
      ),

      // Trade behaviour
      e('div',{className:'settings-section'},
        e('div',{className:'settings-hdr'},'Trade Behaviour Rules'),
        ...[
          {k:'allowOvernight',l:'Allow Overnight Trades',d:'If OFF, all positions are automatically closed before market close each day. This eliminates overnight gap risk — useful for day trading strategies.'},
          {k:'allowWeekend',l:'Allow Weekend Positions',d:'If OFF, all positions are closed before the weekend. Weekends have zero liquidity and prices can gap significantly on Monday open.'},
          {k:'allowNews',l:'Allow Trading During High-Impact News',d:'If OFF, the system will block signals that occur within 30 minutes of major economic news events (like US CPI, NFP, rate decisions). News events cause extreme volatility.'},
          {k:'requireApproval',l:'Require Manual Approval for Every Trade',d:'If ON (recommended), every signal must be manually reviewed and accepted by you before a demo position opens. If OFF, qualifying signals would be auto-executed — not recommended.'},
        ].map(f=>e('div',{key:f.k,style:{padding:'12px 14px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10}},
          e('div',{style:{flex:1}},
            e('div',{style:{fontSize:13,fontWeight:600,marginBottom:2}},f.l),
            e('div',{style:{fontSize:11,color:'var(--text3)',lineHeight:1.5}},f.d)
          ),
          e(Toggle,{k:f.k})
        ))
      ),

      e('div',{style:{padding:'12px 12px 0'}},
        e('button',{className:'btn btn-primary',style:{marginBottom:10},onClick:save},'💾 Save Risk Settings'),
      ),
      e('div',{style:{padding:'0 12px 20px'}},
        e('button',{className:'kill-btn',onClick:killSwitch},'⛔ EMERGENCY KILL SWITCH — BLOCK ALL NEW TRADES NOW')
      ),
      e('div',{className:'disc'},'Risk limits are your personal safety rules. Changing them mid-session does not affect already-open positions. All rules apply to demo mode only until a broker is connected.')
    )
  );
}

// One strategy's live-readiness read: how far it is from the 50-closed /
// 15-auto scorekeeper threshold (trader_strategy_review / strategy-review
// edge function), its fee-and-slippage-adjusted net P/L (net_pnl already has
// both baked in after paper-exit-check applies them), and its worst
// peak-to-trough run (max_drawdown) — the three things worth checking before
// sizing a strategy up with real money, none of which is a live-trading
// switch by itself.
const ZS_READY_MIN_TRADES=50;
// Readiness is judged on AUTO (TP/SL) closes only — manual closes never count
// toward this gate. See the Manual Closes section further down for those.
function zsReadinessOf(sr){
  const auto=sr.auto_trades||0;
  const netPnl=Number(sr.net_pnl)||0; // auto-only net (server computes it that way now)
  if(auto<ZS_READY_MIN_TRADES)return{tier:'data',lbl:'Not enough data yet',cls:'pill-purple'};
  if(sr.verdict==='underperforming')return{tier:'no',lbl:'Losing after fees',cls:'pill-sell'};
  if(sr.verdict==='manual_only')return{tier:'caution',lbl:'Loses on auto — manual saves it',cls:'pill-watch'};
  if(netPnl>0)return{tier:'ready',lbl:'Worth considering',cls:'pill-cyan'};
  return{tier:'caution',lbl:'Breaking even',cls:'pill-watch'};
}
function LiveReadiness({showToast}){
  const[rows,setRows]=useState([]);
  const[flags,setFlags]=useState(null);
  const[loading,setLoading]=useState(false);

  const load=useCallback(async()=>{
    if(!window.ZuShePaperDB)return;
    setLoading(true);
    try{
      const[sr,fl]=await Promise.all([
        window.ZuShePaperDB.loadStrategyReview(),
        window.ZuShePaperDB.getSystemFlags().catch(()=>null)
      ]);
      setRows(sr||[]);
      setFlags(fl||null);
    }catch(err){
      showToast&&showToast('Could not load live-readiness data: '+(err?.message||err),'error');
    }finally{
      setLoading(false);
    }
  },[showToast]);

  useEffect(()=>{
    let cancelled=false,tries=0;
    const iv=setInterval(()=>{
      tries++;
      if(cancelled)return;
      if(window.ZuShePaperDB||tries>20){clearInterval(iv);load();}
    },150);
    return()=>{cancelled=true;clearInterval(iv);};
  },[load]);

  const withData=rows.filter(sr=>(sr.auto_trades||0)>0||(sr.manual_trades||0)>0);
  const readyCount=withData.filter(sr=>zsReadinessOf(sr).tier==='ready').length;
  const liveOn=!!(flags&&flags.live_trading_enabled);

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Live Readiness'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'PER-STRATEGY CHECKLIST · FEE-ADJUSTED')
      ),
      loading&&e('span',{style:{fontSize:10,color:'var(--text3)'}},'Refreshing…')
    ),
    e('div',{className:'scroll'},
      e('div',{className:'info-banner',style:{marginTop:8}},
        e('span',null,'🚀'),
        e('div',null,
          e('div',{style:{fontWeight:700,marginBottom:2}},'What this checks'),
          'For each strategy: whether it has 50 trades actually closed by TP or SL (manual closes never count here — see Manual Closes below), its net P/L after the same exchange fees and stop-loss slippage a real Luno order would face, and its worst peak-to-trough drawdown. Nothing on this screen turns live trading on — that switch lives in Broker Connection.'
        )
      ),

      e('div',{className:'warn-banner'},
        e('div',{className:'warn-icon'},liveOn?'🟢':'⛔'),
        e('div',{className:'warn-text'},
          e('div',{style:{fontWeight:700,marginBottom:3,color:liveOn?'var(--green)':'var(--red)'}},liveOn?'Live Trading Flag: ON':'Live Trading Flag: OFF'),
          'Broker Connection is live under More — this flag and a saved, verified Luno trading key are both required before a single real trade could be placed.'
        )
      ),

      e('div',{className:'stat-grid'},
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},'Strategies Tracked'),
          e('div',{className:'stat-val stat-neu'},withData.length)
        ),
        e('div',{className:'stat-box'},
          e('div',{className:'stat-lbl'},'Worth Considering'),
          e('div',{className:'stat-val '+(readyCount>0?'stat-up':'stat-neu')},readyCount)
        )
      ),

      e('div',{style:{padding:'4px 4px 8px',fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2}},'STRATEGY BREAKDOWN'),
      withData.length===0
        ?e('div',{className:'empty'},
            e('div',{className:'empty-icon'},'🚀'),
            e('div',{className:'empty-title'},'No closed trades yet'),
            e('div',{className:'empty-sub'},'Once strategies start closing trades, their readiness shows up here.')
          )
        :withData.map(sr=>{
            const r=zsReadinessOf(sr);
            const auto=sr.auto_trades||0;
            const tradesLeft=Math.max(0,ZS_READY_MIN_TRADES-auto);
            const netPnl=Number(sr.net_pnl)||0;
            const dd=Number(sr.max_drawdown)||0;
            const manualN=sr.manual_trades||0;
            return e('div',{key:sr.strategy,className:'card'},
              e('div',{className:'row',style:{marginBottom:6}},
                e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                  e('span',{style:{fontWeight:700,fontSize:13}},sr.strategy),
                  e('span',{className:'pill '+r.cls},r.lbl)
                ),
                e('span',{style:{fontFamily:'var(--mono)',fontSize:12,fontWeight:700,color:netPnl>=0?'var(--green)':'var(--red)'}},(netPnl>=0?'+':'')+fmtCur(netPnl))
              ),
              e('div',{style:{fontSize:10,color:'var(--text3)',marginBottom:8}},'Auto (TP/SL) net P/L after fees + slippage — manual closes excluded'),
              e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,background:'var(--glass)',borderRadius:8,padding:'10px',marginBottom:8,textAlign:'center'}},
                e('div',null,
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},'AUTO (TP/SL)'),
                  e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:13,color:tradesLeft===0?'var(--green)':'var(--text)'}},auto+'/'+ZS_READY_MIN_TRADES),
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},tradesLeft===0?'Met':tradesLeft+' to go')
                ),
                e('div',{style:{borderLeft:'1px solid var(--border)',borderRight:'1px solid var(--border)'}},
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},'MANUAL'),
                  e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:13}},manualN),
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},'not counted here')
                ),
                e('div',null,
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},'MAX DRAWDOWN'),
                  e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:13,color:'var(--amber)'}},fmtCur(dd)),
                  e('div',{style:{fontSize:9,color:'var(--text3)'}},'Worst run')
                )
              ),
              e('div',{style:{fontSize:11,color:'var(--text3)',lineHeight:1.5}},
                (sr.win_rate!=null?Math.round(sr.win_rate)+'% win rate · ':'')+
                (sr.profit_factor!=null?'profit factor '+Number(sr.profit_factor).toFixed(2):'profit factor n/a')
              )
            );
          }),

      // Manual closes — kept fully separate from the readiness verdicts above.
      // These say more about your own timing than the strategy's own TP/SL,
      // so they never feed the 50-trade gate or the pass/fail verdict.
      withData.some(sr=>(sr.manual_trades||0)>0)&&e('div',null,
        e('div',{style:{padding:'18px 4px 8px',fontFamily:'var(--mono)',fontSize:9,color:'var(--purple)',letterSpacing:2}},'MANUAL CLOSES · INFORMATIONAL ONLY'),
        e('div',{style:{padding:'0 4px 10px',fontSize:11,color:'var(--text3)',lineHeight:1.5}},'Trades you closed by hand on each strategy — shown separately because they reflect your own timing, not the strategy\'s TP/SL logic.'),
        withData.filter(sr=>(sr.manual_trades||0)>0).map(sr=>{
          const mN=sr.manual_trades||0,mNet=Number(sr.manual_net_pnl)||0,mWr=sr.manual_win_rate;
          return e('div',{key:'manual_'+sr.strategy,className:'card card-sm',style:{marginBottom:8}},
            e('div',{className:'row'},
              e('span',{style:{fontWeight:700,fontSize:13}},sr.strategy),
              e('span',{style:{fontFamily:'var(--mono)',fontSize:12,fontWeight:700,color:mNet>=0?'var(--green)':'var(--red)'}},(mNet>=0?'+':'')+fmtCur(mNet))
            ),
            e('div',{style:{fontSize:11,color:'var(--text3)'}},mN+' manual close'+(mN===1?'':'s')+(mWr!=null?' · '+Math.round(mWr)+'% win rate':''))
          );
        })
      )
    )
  );
}

function BrokerConnection({showToast}){
  const[keyId,setKeyId]=useState('');
  const[keySecret,setKeySecret]=useState('');
  const[saving,setSaving]=useState(false);
  const[keyStatus,setKeyStatus]=useState(null); // {configured, updated_at}
  const[flags,setFlags]=useState(null);
  const[capInput,setCapInput]=useState('');
  const[savingCap,setSavingCap]=useState(false);
  const[confirmText,setConfirmText]=useState('');
  const[togglingLive,setTogglingLive]=useState(false);
  const[orders,setOrders]=useState([]);
  const[ordersLoading,setOrdersLoading]=useState(false);
  const[manualPair,setManualPair]=useState('XBTZAR');
  const[manualDir,setManualDir]=useState('BUY');
  const[manualZar,setManualZar]=useState('');
  const[placing,setPlacing]=useState(false);

  const refresh=useCallback(async()=>{
    if(!window.ZuShePaperDB)return;
    try{
      const[ks,fl,ord]=await Promise.all([
        window.ZuShePaperDB.getTradeKeyStatus(),
        window.ZuShePaperDB.getSystemFlags(),
        window.ZuShePaperDB.listLiveOrders().catch(()=>({orders:[]}))
      ]);
      setKeyStatus(ks);
      setFlags(fl);
      setCapInput(fl&&fl.max_live_order_zar?String(fl.max_live_order_zar):'');
      setOrders((ord&&ord.orders)||[]);
    }catch(err){
      showToast&&showToast('Could not load broker status: '+(err?.message||err),'error');
    }
  },[showToast]);

  useEffect(()=>{
    let cancelled=false,tries=0;
    const iv=setInterval(()=>{
      tries++;
      if(cancelled)return;
      if(window.ZuShePaperDB||tries>20){clearInterval(iv);refresh();}
    },150);
    return()=>{cancelled=true;clearInterval(iv);};
  },[refresh]);

  const saveKey=async()=>{
    if(!keyId.trim()||!keySecret.trim()){showToast('Enter both the key ID and secret','warning');return;}
    setSaving(true);
    try{
      const res=await window.ZuShePaperDB.saveTradeKey(keyId.trim(),keySecret.trim());
      if(res&&res.error){showToast(res.error,'error');}
      else{showToast('Trading key verified and saved','success');setKeyId('');setKeySecret('');await refresh();}
    }catch(err){showToast('Could not save key: '+(err?.message||err),'error');}
    setSaving(false);
  };
  const clearKey=async()=>{
    if(!window.confirm('Remove the stored trading API key? Live orders will be blocked until a new one is added.'))return;
    try{await window.ZuShePaperDB.clearTradeKey();showToast('Trading key removed','info');await refresh();}
    catch(err){showToast('Could not remove key: '+(err?.message||err),'error');}
  };

  const saveCap=async()=>{
    const v=Number(capInput);
    if(!Number.isFinite(v)||v<0){showToast('Enter a valid ZAR amount (0 to disable)','warning');return;}
    setSavingCap(true);
    try{
      await window.ZuShePaperDB.updateSystemFlags({max_live_order_zar:v});
      showToast(v>0?'Max live order size saved':'Live orders disabled (cap set to 0)','success');
      await refresh();
    }catch(err){showToast('Could not save: '+(err?.message||err),'error');}
    setSavingCap(false);
  };

  const canEnableLive=keyStatus&&keyStatus.configured&&flags&&Number(flags.max_live_order_zar)>0;
  const toggleLive=async(turnOn)=>{
    if(turnOn){
      if(!canEnableLive){showToast('Add a verified trading key and set a max order size first','warning');return;}
      if(confirmText.trim().toUpperCase()!=='ENABLE LIVE TRADING'){showToast('Type the confirmation phrase exactly to enable live trading','warning');return;}
      if(!window.confirm('This allows real orders to be placed on your Luno account (up to your max order size, one at a time, only when you tap Place Order below). Continue?'))return;
    }
    setTogglingLive(true);
    try{
      await window.ZuShePaperDB.updateSystemFlags({live_trading_enabled:turnOn,live_trading_confirmed_at:turnOn?new Date().toISOString():null});
      showToast(turnOn?'Live trading enabled':'Live trading disabled','success');
      setConfirmText('');
      await refresh();
    }catch(err){showToast('Could not update: '+(err?.message||err),'error');}
    setTogglingLive(false);
  };

  const placeOrder=async()=>{
    const zar=Number(manualZar);
    if(!Number.isFinite(zar)||zar<=0){showToast('Enter a ZAR amount to spend/sell','warning');return;}
    if(!window.confirm(`Place a REAL ${manualDir} order on Luno for ${manualPair}, sized ~R${zar.toFixed(2)}? This uses real money.`))return;
    setPlacing(true);
    try{
      const res=await window.ZuShePaperDB.placeLiveOrder(manualPair,manualDir,zar);
      if(res&&res.error){showToast(res.error,'error');}
      else{showToast('Live order submitted to Luno','success');setManualZar('');await refresh();}
    }catch(err){showToast('Order failed: '+(err?.message||err),'error');}
    setPlacing(false);
  };

  const liveOn=!!(flags&&flags.live_trading_enabled);
  const killSwitch=!!(flags&&flags.kill_switch_active);

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},'Broker Connection'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'LUNO · REAL MONEY WHEN ENABLED')
      )
    ),
    e('div',{className:'scroll'},
      e('div',{className:'warn-banner',style:{marginTop:8}},
        e('div',{className:'warn-icon'},liveOn?'🟢':'⛔'),
        e('div',{className:'warn-text'},
          e('div',{style:{fontWeight:700,marginBottom:3,color:liveOn?'var(--green)':'var(--red)'}},liveOn?'Live Trading is ON':'Live Trading is OFF'),
          killSwitch?'The kill switch is also active — no live order will be accepted regardless of this setting.'
            :'Every gate below (key, cap, this toggle) is re-checked on the server before any order reaches Luno — nothing fires just because the app says it would.'
        )
      ),

      e('div',{className:'card'},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2,marginBottom:12}},'1 · TRADING API KEY'),
        keyStatus&&keyStatus.configured
          ?e('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:12,background:'var(--glass)',borderRadius:10,padding:'12px 14px'}},
              e('div',{style:{fontSize:24}},'🟢'),
              e('div',null,
                e('div',{style:{fontWeight:700,fontSize:13}},'Trading key configured'),
                e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:2}},keyStatus.updated_at?('Saved '+new Date(keyStatus.updated_at).toLocaleString()):'')
              )
            )
          :e('div',{style:{fontSize:12,color:'var(--text3)',marginBottom:12,lineHeight:1.6}},'No trading key saved yet. Create a Luno API key with Balance + Trading permissions (never Withdraw) and paste it below — it is verified against Luno before saving and is never shown again.'),
        !(keyStatus&&keyStatus.configured)&&e('div',null,
          e('div',{style:{marginBottom:10}},
            e('div',{style:{fontSize:12,fontWeight:600,marginBottom:3}},'API Key ID'),
            e('input',{className:'inp',type:'text',placeholder:'e.g. abcd1234...',value:keyId,onChange:ev=>setKeyId(ev.target.value)})
          ),
          e('div',{style:{marginBottom:12}},
            e('div',{style:{fontSize:12,fontWeight:600,marginBottom:3}},'API Key Secret'),
            e('input',{className:'inp',type:'password',placeholder:'Paste the secret here...',value:keySecret,onChange:ev=>setKeySecret(ev.target.value)})
          ),
          e('button',{className:'btn btn-ghost',onClick:saveKey,disabled:saving},
            saving?e('span',{style:{display:'flex',alignItems:'center',gap:8}},e('div',{className:'spinner'}),'Verifying with Luno...'):'🔒 Verify & Save Key'
          )
        ),
        keyStatus&&keyStatus.configured&&e('button',{className:'btn btn-ghost',onClick:clearKey},'Remove Key')
      ),

      e('div',{className:'card'},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2,marginBottom:12}},'2 · MAX LIVE ORDER SIZE'),
        e('div',{style:{fontSize:12,color:'var(--text3)',marginBottom:10,lineHeight:1.6}},'A hard cap enforced server-side on every order, independent of the toggle below. Set to 0 to block all live orders regardless of anything else.'),
        e('div',{style:{display:'flex',gap:8}},
          e('input',{className:'inp',type:'number',placeholder:'0',value:capInput,onChange:ev=>setCapInput(ev.target.value),style:{flex:1}}),
          e('button',{className:'btn btn-ghost',onClick:saveCap,disabled:savingCap},savingCap?'Saving...':'Save')
        ),
        flags&&e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:8}},'Current cap: R'+(Number(flags.max_live_order_zar)||0).toFixed(2))
      ),

      e('div',{className:'card'},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2,marginBottom:12}},'3 · LIVE TRADING SWITCH'),
        e('div',{style:{fontSize:12,color:'var(--text3)',marginBottom:12,lineHeight:1.6}},
          canEnableLive?'':'Locked until a verified key is saved and a max order size above R0 is set.'),
        e('div',{className:'row',style:{marginBottom:liveOn?0:12}},
          e('div',null,
            e('div',{style:{fontSize:13,fontWeight:600}},'Live Trading'),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:2}},liveOn?'Orders can be placed manually below.':'Off — nothing can be sent to Luno.')
          ),
          e('label',{className:'sw'},
            e('input',{type:'checkbox',checked:liveOn,disabled:togglingLive||(!liveOn&&!canEnableLive),onChange:ev=>toggleLive(ev.target.checked)}),
            e('span',{className:'sw-slider'})
          )
        ),
        !liveOn&&canEnableLive&&e('div',null,
          e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:6}},'Type ENABLE LIVE TRADING to confirm, then flip the switch above:'),
          e('input',{className:'inp',type:'text',placeholder:'ENABLE LIVE TRADING',value:confirmText,onChange:ev=>setConfirmText(ev.target.value)})
        )
      ),

      liveOn&&!killSwitch&&e('div',{className:'card'},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--amber)',letterSpacing:2,marginBottom:12}},'MANUAL LIVE ORDER'),
        e('div',{style:{fontSize:11,color:'var(--text3)',marginBottom:12,lineHeight:1.6}},'Not connected to any signal or strategy — this places a real market order on Luno only when you tap the button, for testing the pipeline or acting on your own judgment.'),
        e('div',{style:{display:'flex',gap:8,marginBottom:8}},
          e('select',{className:'inp',value:manualPair,onChange:ev=>setManualPair(ev.target.value),style:{flex:1}},
            ['XBTZAR','ETHZAR','XRPZAR'].map(p=>e('option',{key:p,value:p},p))
          ),
          e('select',{className:'inp',value:manualDir,onChange:ev=>setManualDir(ev.target.value),style:{flex:1}},
            e('option',{value:'BUY'},'BUY'),e('option',{value:'SELL'},'SELL')
          )
        ),
        e('div',{style:{display:'flex',gap:8}},
          e('input',{className:'inp',type:'number',placeholder:'ZAR amount',value:manualZar,onChange:ev=>setManualZar(ev.target.value),style:{flex:1}}),
          e('button',{className:'btn btn-red',onClick:placeOrder,disabled:placing},placing?'Placing...':'Place Order')
        )
      ),

      e('div',{style:{padding:'4px 4px 8px',fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2}},'RECENT LIVE ORDERS'),
      orders.length===0
        ?e('div',{className:'empty'},
            e('div',{className:'empty-icon'},'🔌'),
            e('div',{className:'empty-title'},'No live orders yet'),
            e('div',{className:'empty-sub'},'Everything so far has been paper trading — this list stays empty until a real order is placed.')
          )
        :orders.map(o=>e('div',{key:o.id,className:'card',style:{padding:'10px 14px'}},
            e('div',{className:'row'},
              e('span',{style:{fontWeight:700,fontSize:12}},o.direction+' '+o.pair),
              e('span',{className:'pill '+(o.status==='submitted'?'pill-cyan':'pill-sell')},o.status)
            ),
            e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:4}},
              'R'+Number(o.requested_zar).toFixed(2)+(o.luno_order_id?' · order '+o.luno_order_id:'')+' · '+new Date(o.created_at).toLocaleString()
            ),
            o.error&&e('div',{style:{fontSize:11,color:'var(--red)',marginTop:4}},o.error)
          )),

      e('div',{className:'disc'},'Real broker orders bypass the paper account entirely — they use real ZAR on your Luno account. The max order size and live trading switch are enforced server-side on every request, not just in this screen.')
    )
  );
}

function DataFeedSettings({showToast}){
  const[loading,setLoading]=useState(true);
  const[configured,setConfigured]=useState(false);
  const[keyId,setKeyId]=useState('');
  const[keySecret,setKeySecret]=useState('');
  const[showSecret,setShowSecret]=useState(false);
  const[saving,setSaving]=useState(false);

  const loadStatus=async()=>{
    setLoading(true);
    try{
      for(let i=0;i<20&&!window.ZuShePaperDB;i++){ await new Promise(r=>setTimeout(r,150)); }
      if(!window.ZuShePaperDB){ setLoading(false); return; }
      const flags=await window.ZuShePaperDB.getSystemFlags();
      setConfigured(!!(flags&&flags.luno_key_id));
    }catch(err){
      console.warn('[ZuShé Trader] Could not load data-feed status:',err?.message||err);
    }finally{
      setLoading(false);
    }
  };

  useEffect(()=>{ loadStatus(); },[]);

  const save=async()=>{
    if(!keyId.trim()||!keySecret.trim()){
      showToast('Enter both the Key ID and Key Secret before saving','warning');
      return;
    }
    setSaving(true);
    try{
      await window.ZuShePaperDB.saveLunoKey(keyId.trim(),keySecret.trim());
      showToast('Luno data-feed key saved — the evolution engine will use it on its next run','success');
      setKeyId('');setKeySecret('');setShowSecret(false);
      await loadStatus();
    }catch(err){
      showToast('Could not save key: '+(err?.message||err),'error');
    }finally{
      setSaving(false);
    }
  };

  const clearKey=async()=>{
    if(!window.confirm('Remove the saved Luno API key?\n\nMarket data (candles) will stop updating until a new key is pasted here.'))return;
    setSaving(true);
    try{
      await window.ZuShePaperDB.saveLunoKey(null,null);
      showToast('Luno data-feed key removed','info');
      await loadStatus();
    }catch(err){
      showToast('Could not clear key: '+(err?.message||err),'error');
    }finally{
      setSaving(false);
    }
  };

  return e('div',{className:'settings-section'},
    e('div',{className:'settings-hdr'},'Data Feed — Luno API Key'),
    e('div',{style:{padding:'0 14px 10px'}},
      e('div',{style:{fontSize:11,color:'var(--text2)',lineHeight:1.6,marginBottom:10}},

function ParserKeySettings({showToast}){
  const[loading,setLoading]=useState(true);
  const[configured,setConfigured]=useState(false);
  const[key,setKey]=useState('');
  const[showKey,setShowKey]=useState(false);
  const[saving,setSaving]=useState(false);

  const loadStatus=async()=>{
    setLoading(true);
    try{
      for(let i=0;i<20&&!window.ZuShePaperDB;i++){ await new Promise(r=>setTimeout(r,150)); }
      if(window.ZuShePaperDB){
        const r=await window.ZuShePaperDB.getSecretStatus('gemini_api_key');
        setConfigured(!!(r&&r.configured));
      }
    }catch(err){
      console.warn('[ZuShé Trader] Could not load parser-key status:',err?.message||err);
    }finally{ setLoading(false); }
  };
  useEffect(()=>{ loadStatus(); },[]);

  const save=async()=>{
    if(!key.trim()){ showToast('Paste your Gemini API key first','warning'); return; }
    setSaving(true);
    try{
      const r=await window.ZuShePaperDB.saveSecret('gemini_api_key',key.trim());
      if(r&&r.error){ showToast(r.error,'warning'); }
      else{
        showToast('Gemini key verified and saved — Telegram screenshots can be read now','success');
        setKey('');setShowKey(false);
        await loadStatus();
      }
    }catch(err){ showToast('Could not save key: '+(err?.message||err),'error'); }
    finally{ setSaving(false); }
  };

  const clearKey=async()=>{
    if(!window.confirm('Remove the saved Gemini key?\n\nTelegram screenshot parsing will stop until a new key is saved.'))return;
    setSaving(true);
    try{
      await window.ZuShePaperDB.clearSecret('gemini_api_key');
      showToast('Gemini key removed','info');
      await loadStatus();
    }catch(err){ showToast('Could not remove key: '+(err?.message||err),'error'); }
    finally{ setSaving(false); }
  };

  return e('div',{className:'settings-section'},
    e('div',{className:'settings-hdr'},'Telegram Screenshot Reader — Gemini Key'),
    e('div',{style:{padding:'0 14px 10px'}},
      e('div',{style:{fontSize:11,color:'var(--text2)',lineHeight:1.6,marginBottom:10}},
        'Reading a trade call from a screenshot uses Google Gemini, which has a free tier (no card needed). Get a key at ',
        e('strong',{style:{color:'var(--cyan)'}},'aistudio.google.com → Get API key'),
        ', paste it below and tap Save. It is checked with Google first, then stored on the server where this app cannot read it back — you will only ever see whether it is saved.'
      ),
      loading
        ? e('div',{style:{fontSize:11,color:'var(--text3)',padding:'6px 0'}},'Checking status…')
        : e('div',{className:'row',style:{marginBottom:12}},
            e('div',{style:{fontSize:12,color:'var(--text2)'}},'Current status'),
            configured
              ? e('span',{className:'pill pill-buy'},'● KEY SAVED')
              : e('span',{className:'pill pill-watch'},'● NOT SET — screenshot reader inactive')
          ),
      e('div',{style:{marginBottom:10}},
        e('div',{className:'inp-lbl'},'Gemini API Key'),
        e('div',{style:{display:'flex',gap:6}},
          e('input',{className:'inp',type:showKey?'text':'password',placeholder:configured?'Saved — paste a new key to replace it':'Paste your Gemini API key',value:key,onChange:ev=>setKey(ev.target.value),autoCapitalize:'off',autoCorrect:'off',spellCheck:false,style:{flex:1}}),
          e('button',{className:'btn btn-ghost btn-xs',type:'button',onClick:()=>setShowKey(v=>!v)},showKey?'Hide':'Show')
        )
      ),
      e('div',{className:'btn-row',style:{marginTop:2}},
        e('button',{className:'btn btn-primary',disabled:saving,onClick:save},saving?'Checking…':'✓ Save Key'),
        configured&&e('button',{className:'btn btn-ghost',disabled:saving,onClick:clearKey},'Remove Key')

      e('div',{style:{fontSize:10,color:'var(--text3)',marginTop:10,lineHeight:1.5}},

function AppSettings({showToast,onLogout,account,setAccount,signals,setSignals}){

  const[clearConfirm,setClearConfirm]=useState(null);

  // Mirrors the same Open/Closed-TP/Closed-SL/Closed-Manual split used on the
  // Signal Desk, so each "Clear" button here removes exactly what that
  // sub-tab shows — nothing more.
  const sigList=signals||[];
  const openSigIds2=useMemo(()=>new Set((account.openPositions||[]).filter(p=>p.sigId).map(p=>p.sigId)),[account.openPositions]);
  const closedSigBucket2=useMemo(()=>{
    const m={};
    (account.closedTrades||[]).forEach(t=>{ if(t.sigId&&!(t.sigId in m))m[t.sigId]=zsExitBucket(t); });
    return m;
  },[account.closedTrades]);
  const sigBuckets={
    pending:sigList.filter(s=>s.status==='Pending'),
    open:sigList.filter(s=>s.status==='Accepted'&&(openSigIds2.has(s.id)||!(s.id in closedSigBucket2))),
    closedTp:sigList.filter(s=>s.status==='Accepted'&&closedSigBucket2[s.id]==='tp'),
    closedSl:sigList.filter(s=>s.status==='Accepted'&&closedSigBucket2[s.id]==='sl'),
    closedManual:sigList.filter(s=>s.status==='Accepted'&&closedSigBucket2[s.id]==='manual'),
    watching:sigList.filter(s=>s.status==='Watching'),
    rejected:sigList.filter(s=>s.status==='Rejected'),
  };
  const clearLabels={pending:'Pending',open:'Open',closedTp:'Closed · TP',closedSl:'Closed · SL',closedManual:'Closed · Manual',watching:'Watching',rejected:'Rejected'};

  async function clearSignalBucket(key){
    const items=key==='all'?sigList:sigBuckets[key];
    if(!items.length){showToast('Nothing to clear here','info');return;}
    if(clearConfirm!==key){setClearConfirm(key);return;}
    setClearConfirm(null);
    setClearBusy(key);
    try{
      const ids=items.map(s=>s.id).filter(Boolean);
      if(window.ZuShePaperDB?.deleteSignals)await window.ZuShePaperDB.deleteSignals(ids);
      const idSet=new Set(ids);
      setSignals&&setSignals(ss=>ss.filter(s=>!idSet.has(s.id)));
      showToast('Cleared '+items.length+' signal'+(items.length===1?'':'s'),'success');
    }catch(err){
      showToast('Could not clear: '+(err?.message||err),'error');
    }finally{
      setClearBusy(null);
    }
  }

  // Clears the local Dashboard "paper engine" (localStorage-based, separate
  // from the Supabase-backed Signal Desk) — mainly for wiping out the
  // degenerate "NO TRADE" ghost positions/closed trades a past bug could
  // have left behind in account.openPositions / account.closedTrades.

  function resetLocalPaperEngine(){
    if(!resetConfirm){ setResetConfirm(true); return; }
    paperReset();
    setAccount&&setAccount(a=>({...DEMO_ACCOUNT_SEED,balance:a?.balance||DEMO_ACCOUNT_SEED.balance}));
    setResetConfirm(false);
    showToast('Local paper engine data cleared','success');
  }

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      for(let i=0;i<20&&!window.ZuShePaperDB;i++){ await new Promise(r=>setTimeout(r,150)); }
      if(cancelled||!window.ZuShePaperDB)return;
      try{
        window.ZuShePaperDB.getSystemFlags().then(fl=>{if(!cancelled)setSysFlags(fl);}).catch(()=>{});
        const sub=await window.ZuShePaperDB.getPushSubscription();
        if(cancelled)return;
        if(sub && typeof Notification!=='undefined' && Notification.permission==='granted'){
          setNotifs(true);
          const db=window.ZuShePaperDB.init();
          if(db){
            const{data}=await db.from('trader_push_subscriptions').select('prefs').eq('endpoint',sub.endpoint).maybeSingle();
            if(!cancelled && data?.prefs){
              setSigAlerts(data.prefs.trades!==false);
              setRiskAlerts(data.prefs.risk!==false);
              setEvoAlerts(data.prefs.evolution!==false);
              setNewSigAlerts(data.prefs.signals!==false);
            }
          }
        }
      }catch(_err){/* leave defaults — user can retry via the toggle */}
    })();
    return()=>{cancelled=true};
  },[]);

  function pushPrefs(sig,risk,evo,newSig){
    return{trades:sig,risk:risk,evolution:evo,signals:newSig};
  }

  async function handleMasterToggle(checked){
    if(pushBusy)return;
    setPushBusy(true);
    try{
      if(checked){
        await window.ZuShePaperDB.subscribePush(pushPrefs(sigAlerts,riskAlerts,evoAlerts,newSigAlerts));
        setNotifs(true);
        showToast('Push notifications enabled','success');
      }else{
        await window.ZuShePaperDB.unsubscribePush();
        setNotifs(false);
        showToast('Push notifications turned off','info');
      }
    }catch(err){
      showToast(err?.message||'Could not update push notifications','error');
      setNotifs(!checked);
    }finally{
      setPushBusy(false);
    }
  }

  async function handleCategoryToggle(key,checked){
    const next={
      sigAlerts:[checked,riskAlerts,evoAlerts,newSigAlerts],
      riskAlerts:[sigAlerts,checked,evoAlerts,newSigAlerts],
      evoAlerts:[sigAlerts,riskAlerts,checked,newSigAlerts],
      newSigAlerts:[sigAlerts,riskAlerts,evoAlerts,checked]

    if(key==='sigAlerts')setSigAlerts(checked);
    if(key==='riskAlerts')setRiskAlerts(checked);
    if(key==='evoAlerts')setEvoAlerts(checked);
    if(key==='newSigAlerts')setNewSigAlerts(checked);
    if(notifs){
      try{ await window.ZuShePaperDB.updatePushPrefs(pushPrefs(...next)); }
      catch(_err){ showToast('Saved locally but failed to sync to server','warning'); }
    }
  }
