function App(){
  const[authed,setAuthed]=useState(()=>LS.get('za_auth',false));
  const[screen,setScreen]=useState('dashboard');
  const[subScreen,setSubScreen]=useState(null);
  const[signals,setSignals]=useState(()=>LS.get('za_signals',[]));
  const[signalsLoading,setSignalsLoading]=useState(false);
  const[strategies,setStrategies]=useState(()=>LS.get('za_strategies',STRATS_SEED));
  const[account,setAccount]=useState(()=>LS.get('za_account',DEMO_ACCOUNT_SEED));
  const[riskSettings,setRiskSettings]=useState(()=>{
    const saved=LS.get('za_risk',RISK_SETTINGS_SEED);
    // One-time bump (v2) so an already-saved conservative setup does not block accepting many signals for paper testing.
    if(LS.get('za_risk_v',1)<2){
      LS.set('za_risk_v',2);
      return {...saved,maxOpenTrades:Math.max(saved.maxOpenTrades||1,40),maxDailyLoss:Math.max(saved.maxDailyLoss||3,15),maxWeeklyLoss:Math.max(saved.maxWeeklyLoss||8,25),maxPerMarket:Math.max(saved.maxPerMarket||1,12),maxPerStrategy:Math.max(saved.maxPerStrategy||1,12),maxDD:Math.max(saved.maxDD||15,30),losingStreak:Math.max(saved.losingStreak||3,12)};
    }
    return saved;
  });
  const[showToast,ToastContainer]=useToast();
  const[livePrices,setLivePrices]=useState({});

  // Live mark-to-market: poll the last-traded price for every pair with an
  // open position, plus every pair with a live (non-rejected) signal on
  // the Signal Desk (every 60s, plus immediately whenever that pair set
  // changes) so both Equity and the Signal Desk's Current Price field
  // reflect the real market instead of a stale/absent value. This never
  // touches account.balance/equity in state — those stay server-
  // authoritative, updated only when a position actually closes
  // (checkExits / paper-exit-check).
  const livePairSet=[...new Set([
    ...(account.openPositions||[]).map(p=>p.pair),
    ...signals.filter(s=>s.status!=='Rejected').map(s=>s.pair)
  ])].filter(Boolean);
  const openPairsKey=livePairSet.sort().join(',');
  useEffect(()=>{
    const pairs=[...new Set(livePairSet)];
    if(!pairs.length)return;
    let cancelled=false;
    const fetchAll=async()=>{
      const entries=await Promise.all(pairs.map(async pair=>{
        try{
          const t=await DataProviders.luno.getTicker(pair);
          const last=Number(t.last_trade||t.last||0);
          return [pair,last>0?last:null];
        }catch(_e){ return [pair,null]; }
      }));
      if(cancelled)return;
      setLivePrices(prev=>{
        const next={...prev};
        entries.forEach(([pair,last])=>{ if(last)next[pair]=last; });
        return next;
      });
    };
    fetchAll();
    const iv=setInterval(fetchAll,60000);
    return()=>{cancelled=true;clearInterval(iv);};
  },[openPairsKey]);

  const unrealizedTotal=useMemo(()=>{
    return (account.openPositions||[]).reduce((sum,pos)=>{
      const pl=zsUnrealizedPl(pos,livePrices[pos.pair]);
      return pl==null?sum:sum+pl;
    },0);
  },[account.openPositions,livePrices]);
  const liveEquity=parseFloat((account.balance+unrealizedTotal).toFixed(2));

  // Persist state
  useEffect(()=>{LS.set('za_signals',signals);},[signals]);
  useEffect(()=>{LS.set('za_strategies',strategies);},[strategies]);
  useEffect(()=>{LS.set('za_account',account);},[account]);
  useEffect(()=>{LS.set('za_risk',riskSettings);},[riskSettings]);

  // Server is the source of truth. On load, every 60s and whenever the tab becomes visible:
  // rebuild balance, open positions and closed trades from Supabase, and self-heal the server
  // balance if it ever disagrees with the sum of closed trades.
  const accountRef=useRef(account);accountRef.current=account;
  const syncFromServer=useCallback(async()=>{
    const db=window.ZuShePaperDB; if(!db?.ensureAccount)return;
    try{
      let remote=await db.ensureAccount(); if(!remote)return;
      const LIMIT=10000;
      const rows=await db.loadTrades(LIMIT);
      const complete=rows.length<LIMIT;
      const tz=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'});
      const today=tz(Date.now());
      const openRows=rows.filter(t=>t.status==='OPEN');
      const closedAll=rows.filter(t=>t.status==='CLOSED');
      const closedRows=closedAll.filter(t=>!zsIsVoided(t));
      const voidedIds=new Set(closedAll.filter(zsIsVoided).map(t=>t.id));
      if(complete){
        const start=Number(remote.starting_balance)||10000;
        const expected=parseFloat((start+closedAll.reduce((s,t)=>s+(Number(t.net_pnl)||0),0)).toFixed(2));
        if(Math.abs(expected-Number(remote.balance))>0.05){
          try{const fixed=await db.recomputeAccount(); if(fixed)remote=fixed;}catch(_e){}
        }
      }
      const balance=Number(remote.balance);
      if(!Number.isFinite(balance))return;
      const daily=parseFloat(closedAll.filter(t=>t.exit_time&&tz(t.exit_time)===today).reduce((s,t)=>s+(Number(t.net_pnl)||0),0).toFixed(2));
      // local positions that closed on the server since we last looked -> feed the local risk stats
      const openIds=new Set(openRows.map(t=>t.id));
      const closedById={};closedRows.forEach(t=>{closedById[t.id]=t;});
      (accountRef.current.openPositions||[]).forEach(p=>{
        if(p.paper&&p.dbId&&!openIds.has(p.dbId)&&closedById[p.dbId])recordPaperTradeResult(Number(closedById[p.dbId].net_pnl)||0);
      });
      setAccount(a=>{
        const localOpen=a.openPositions||[];
        const byDb={};localOpen.forEach(p=>{if(p.dbId)byDb[p.dbId]=p;});
        const serverOpen=openRows.map(t=>{const p=byDb[t.id];return p?{...p,market:p.market||zsPairAsset(p.pair),strat:p.strat||p.strategy}:zsRowToPos(t);});
        const recent=Date.now()-2*60*1000;
        const keepLocal=localOpen.filter(p=>{
          if(!p.paper||!p.dbId)return true; // demo / legacy positions are left alone
          if(openIds.has(p.dbId))return false;          // already taken from the server list
          if(closedAll.some(t=>t.id===p.dbId))return false; // closed or voided on the server
          return !complete||(p.openedAt||0)>recent;     // unknown to server: keep only if too new / list incomplete
        });
        const openPositions=[...serverOpen,...keepLocal];
        const serverClosedIds=new Set(closedAll.map(t=>t.id));
        const localClosedKept=(a.closedTrades||[]).filter(t=>t.status!=='Void'&&!(t.dbId&&(serverClosedIds.has(t.dbId)||voidedIds.has(t.dbId)))&&!(t.paper&&Math.abs(Number(t.pl)||0)>50000));
        const closedTrades=[...closedRows.map(zsRowToClosed),...localClosedKept].sort((x,y)=>new Date(y.closeTime||0)-new Date(x.closeTime||0));
        return {...a,balance,equity:balance,dailyPL:daily,openPositions,closedTrades,
          starting_balance:Number(remote.starting_balance)||zsStartBal(a),
          used:parseFloat(openPositions.reduce((s,p)=>s+(Number(p.risk)||0),0).toFixed(2))};
      });
    }catch(err){ console.warn('[ZuShé Trader] Could not sync Supabase paper account:',err?.message||err); }
  },[]);
  useEffect(()=>{
    let cancelled=false,iv=null;
    (async()=>{
      for(let i=0;i<20&&!window.ZuShePaperDB;i++){ await new Promise(r=>setTimeout(r,150)); }
      if(cancelled||!window.ZuShePaperDB)return;
      syncFromServer();
      iv=setInterval(syncFromServer,60000);
    })();
    const onVis=()=>{ if(document.visibilityState==='visible')syncFromServer(); };
    document.addEventListener('visibilitychange',onVis);
    console.info('[ZuShé Trader] build',ZS_BUILD);
    return()=>{cancelled=true;if(iv)clearInterval(iv);document.removeEventListener('visibilitychange',onVis);};
  },[]);

  // Pulls the latest signals from trader_signals (written by the signal-scan
  // cron) and maps them onto the UI shape Signal Desk expects. Exposed to
  // Signal Desk as a manual "⟳ Refresh" trigger, and run once on load so the
  // Dashboard's pending-signal pill is accurate immediately.
  const refreshSignals=useCallback(async()=>{
    if(!window.ZuShePaperDB?.loadSignals)return;
    setSignalsLoading(true);
    try{
      const rows=await window.ZuShePaperDB.loadSignals();
      setSignals(rows.map(r=>mapDbSignalToUi(r,account)));
    }catch(err){
      console.warn('[ZuShé Trader] Could not load signals:',err?.message||err);
    }finally{setSignalsLoading(false);}
  },[account]);

  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      for(let i=0;i<20&&!window.ZuShePaperDB;i++){ await new Promise(r=>setTimeout(r,150)); }
      if(cancelled||!window.ZuShePaperDB)return;
      refreshSignals();
    })();
    return()=>{cancelled=true;};
  },[]);

  const login=()=>{LS.set('za_auth',true);setAuthed(true);};
  const logout=()=>{LS.set('za_auth',false);setAuthed(false);setSubScreen(null);setScreen('dashboard');};

  if(!authed)return e('div',{className:'app'},e(Login,{onLogin:login}));

  const NAV=[
    {id:'dashboard',icon:'⊞',label:'Dashboard'},
    {id:'signals',icon:'⚡',label:'Signals'},
    {id:'evolution',icon:'🧬',label:'Evolution'},
    {id:'portfolio',icon:'💼',label:'Portfolio'},
    {id:'more',icon:'≡',label:'More'},
  ];

  const SUB_SCREENS={
    journal:e(TradeJournal,{account}),
    backtest:e(BacktestArena,{strategies}),
    forward:e(ForwardTest,{strategies,setStrategies,showToast}),
    risk:e(RiskVault,{riskSettings,setRiskSettings,account,showToast}),
    readiness:e(LiveReadiness,{showToast}),
    broker:e(BrokerConnection,{showToast}),
    settings:e(AppSettings,{showToast,onLogout:logout,account,setAccount,signals,setSignals}),
  };

  const SCREENS={
    dashboard:e(Dashboard,{account,setAccount,signals,strategies,showToast,setScreen,liveEquity,unrealizedTotal}),
    signals:e(SignalDesk,{signals,setSignals,account,setAccount,showToast,riskSettings,refreshSignals,signalsLoading,livePrices}),
    evolution:e(EvolutionLab,{showToast}),
    portfolio:e(Portfolio,{account,setAccount,showToast,liveEquity,unrealizedTotal,livePrices}),
    more:e(MoreMenu,{setSubScreen:(id)=>{setSubScreen(id);}}),
  };

  return e('div',{className:'app'},
    e(ToastContainer),
    // Sub-screen overlay
    subScreen&&e('div',{style:{position:'fixed',inset:0,zIndex:300,background:'var(--bg)',maxWidth:480,margin:'0 auto'}},
      e('div',{style:{position:'absolute',top:0,left:0,right:0,zIndex:10}},
        e('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'14px 16px 10px',background:'rgba(8,12,11,.95)',backdropFilter:'blur(20px)',borderBottom:'1px solid var(--border)'}},
          e('button',{onClick:()=>setSubScreen(null),style:{background:'var(--glass2)',border:'1px solid var(--border)',borderRadius:8,width:34,height:34,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}},'←'),
          e('div',{style:{fontSize:15,fontWeight:700,color:'var(--text)'}},
            {journal:'Trade Journal',backtest:'Backtest Arena',forward:'Forward Testing',risk:'Risk Vault',readiness:'Live Readiness',broker:'Broker Connection',settings:'Settings'}[subScreen]||subScreen
          )
        )
      ),
      e('div',{style:{paddingTop:62,height:'100%',overflow:'hidden'}},
        SUB_SCREENS[subScreen]||null
      )
    ),
    // Main screens
    !subScreen&&e('div',{style:{height:'100%',display:'flex',flexDirection:'column'}},
      SCREENS[screen]||SCREENS.dashboard,
      e('nav',{className:'nav'},
        NAV.map(n=>e('button',{key:n.id,className:'nb '+(screen===n.id&&!subScreen?'on':''),onClick:()=>{setScreen(n.id);setSubScreen(null);}},
          e('div',{className:'nb-icon'},n.icon),
          n.label
        ))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));

</script>

<script>
/* ============================================================
   ZuShé Trader — Phase 2 persistence layer
   Supabase stores PAPER data only. No exchange secrets are used.
   ============================================================ */
(function () {
  'use strict';

  const ZS_SUPABASE_URL = 'https://oenjtbcaanvvhfglkxhy.supabase.co';
  const ZS_SUPABASE_KEY = 'sb_publishable_ioF9Qw3xVWKwYIrxhwGy-A_ElWAjXwj';
  const ZS_OWNER_KEY = 'zushé-paper-owner-v1';
  const ZS_SYSTEM_KEY = 'zushé-system-v1'; // must match SYSTEM_FLAGS_KEY in the evolution-engine edge function
  const ZS_EVOLUTION_KEY = 'zushé-evolution-account-v1'; // must match EVOLUTION_OWNER_KEY in the evolution-engine edge function
  const ZS_EVOLUTION_ENGINE_URL = ZS_SUPABASE_URL + '/functions/v1/evolution-engine';
  const ZS_PAIR = 'XBTZAR';
  const ZS_TIMEFRAME = 3600;

  let zsClient = null;
  let zsAccount = null;

  function zsInitSupabase() {
    if (zsClient || !window.supabase?.createClient) return zsClient;
    zsClient = window.supabase.createClient(ZS_SUPABASE_URL, ZS_SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
    return zsClient;
  }

  async function zsEnsureAccount() {
    const db = zsInitSupabase();
    if (!db) return null;

    const { data, error } = await db
      .from('trader_paper_accounts')
      .select('*')
      .eq('owner_key', ZS_OWNER_KEY)
      .maybeSingle();

    if (error) throw error;
    if (data) {
      zsAccount = data;
      return data;
    }

    const { data: created, error: createError } = await db
      .from('trader_paper_accounts')
      .insert({
        owner_key: ZS_OWNER_KEY,
        name: 'Primary Paper Account',
        currency: 'ZAR',
        starting_balance: 10000,
        balance: 10000,
        equity: 10000
      })
      .select()
      .single();

    if (createError) throw createError;
    zsAccount = created;
    return created;
  }

  async function zsSaveSettings(extra = {}) {
    const db = zsInitSupabase();
    if (!db) return;
    const payload = Object.assign({
      owner_key: ZS_OWNER_KEY,
      paper_mode: true,
      pair: ZS_PAIR,
      timeframe: ZS_TIMEFRAME,
      starting_balance: 10000,
      risk_per_trade: 0.01,
      max_daily_loss: 0.15,
      max_open_trades: 40,
      max_consecutive_losses: 12,
      leverage: 0,
      auto_paper_execution: false
    }, extra);

    const { error } = await db
      .from('trader_bot_settings')
      .upsert(payload, { onConflict: 'owner_key' });

    if (error) throw error;
  }

  // Reads the single shared admin/system-flags row (kill switch, risk cap,
  // evolution toggle, and the Luno data-feed key). This row is what the
  // evolution-engine edge function also reads server-side, so saving here
  // takes effect on the very next scheduled run — no redeploy needed.
  async function zsGetSystemFlags() {
    const db = zsInitSupabase();
    if (!db) return null;
    const { data, error } = await db
      .from('trader_system_flags')
      .select('*')
      .eq('owner_key', ZS_SYSTEM_KEY)
      .maybeSingle();
    if (error) throw error;
    return data;
  }

  // Saves (or updates) the read-only Luno API key used for the candles feed.
  // Pass null/'' for either field to clear it. This key must be a
  // no-permissions (MP_None) key — it can only read market data, never
  // place trades or move funds — so storing it in this admin-editable table
  // (rather than as a hidden server secret) is an accepted tradeoff for
  // being able to change it from Settings at any time.
  async function zsSaveLunoKey(keyId, keySecret) {
    const db = zsInitSupabase();
    if (!db) throw new Error('Supabase not available');
    const { error } = await db
      .from('trader_system_flags')
      .upsert({
        owner_key: ZS_SYSTEM_KEY,
        luno_key_id: keyId ? String(keyId).trim() : null,
        luno_key_secret: keySecret ? String(keySecret).trim() : null,
        luno_key_updated_at: new Date().toISOString()
      }, { onConflict: 'owner_key' });
    if (error) throw error;
  }

  async function zsSaveCandles(candles) {
    const db = zsInitSupabase();
    if (!db || !Array.isArray(candles) || !candles.length) return;
    const rows = candles.map(c => ({
      pair: ZS_PAIR,
      duration: ZS_TIMEFRAME,
      timestamp: Number(c.timestamp ?? c.time ?? c.ts),
      open: Number(c.open),
      high: Number(c.high),
      low: Number(c.low),
      close: Number(c.close),
      volume: Number(c.volume ?? 0)
    })).filter(c => Number.isFinite(c.timestamp) && Number.isFinite(c.close));

    if (!rows.length) return;
    const { error } = await db
      .from('trader_market_candles')
      .upsert(rows, { onConflict: 'pair,duration,timestamp' });
    if (error) throw error;
  }

  async function zsSaveSignal(signal) {
    const db = zsInitSupabase();
    if (!db || !signal) return;
    // Only a real BUY/SELL setup is a signal — a NO TRADE evaluation is the
    // Dashboard's own "nothing lines up right now" result and must never be
    // written to trader_signals, or it shows up on the Signal Desk as a
    // fake pending proposal (0% confidence, blank entry/stop/target) and,
    // if accidentally accepted, as a degenerate paper position that opens
    // and instantly "closes" for exactly R0 profit. signal-scan (the
    // server cron) already enforces this same rule; this mirrors it here.
    if (signal.direction !== 'BUY' && signal.direction !== 'SELL') return;
    const account = zsAccount || await zsEnsureAccount();
    // The raw signal only carries `price` + `stopDistance`; derive an
    // indicative entry/stop/target here (mirrors the app's own 1:2 R:R
    // model) so these columns are actually populated instead of null.
    const hasSetup = true;
    const price = Number(signal.price || 0);
    const dist = Number(signal.stopDistance || 0);
    const stopPrice = hasSetup ? (signal.direction === 'BUY' ? price - dist : price + dist) : null;
    const takeProfit = hasSetup ? (signal.direction === 'BUY' ? price + dist * 2 : price - dist * 2) : null;
    const { error } = await db.from('trader_signals').insert({
      account_id: account?.id || null,
      pair: signal.pair || ZS_PAIR,
      timeframe: ZS_TIMEFRAME,
      strategy: signal.strategy || 'Combined',
      direction: signal.direction || 'NO TRADE',
      confidence: Number(signal.confidence || 0),
      entry_price: hasSetup ? price || null : null,
      stop_price: stopPrice,
      take_profit: takeProfit,
      risk_amount: Number(signal.riskAmount || 0),
      reason: signal.reason || '',
      evidence: signal.evidence || {}
    });
    if (error) throw error;
  }

  async function zsLoadTrades(limit = 100) {
    const db = zsInitSupabase();
    if (!db) return [];
    const account = zsAccount || await zsEnsureAccount();
    const { data, error } = await db
      .from('trader_paper_trades')
      .select('*')
      .eq('account_id', account.id)
      .order('entry_time', { ascending: false })
      .limit(limit);
    if (error) throw error;
    return data || [];
  }

  // ── Evolution Engine (the REAL one, running server-side) ─────────────
  // This is a separate R10,000 sandbox account the autonomous evolution-
  // engine edge function trades on its own, entirely independent of the
  // user's own paper account above. These three loaders surface that real
  // data so the Evolution Engine screen stops showing hardcoded demo
  // strategies that have nothing to do with what's actually running.
  let zsEvoAccountCache = null;

  async function zsLoadEvolutionAccount(force = false) {
    const db = zsInitSupabase();
    if (!db) return null;
    if (zsEvoAccountCache && !force) return zsEvoAccountCache;
    const { data, error } = await db.from('trader_paper_accounts').select('*').eq('owner_key', ZS_EVOLUTION_KEY).maybeSingle();
    if (error) { console.warn('[ZuShé Trader] loadEvolutionAccount failed:', error.message || error); return null; }
    zsEvoAccountCache = data || null;
    return zsEvoAccountCache;
  }

  async function zsLoadStrategyPool() {
    const db = zsInitSupabase();
    if (!db) return [];
    const account = await zsLoadEvolutionAccount();
    if (!account) return [];
    const { data, error } = await db.from('trader_strategy_pool').select('*').eq('account_id', account.id)
      .order('status', { ascending: true }).order('generation', { ascending: false }).order('score', { ascending: false });
    if (error) { console.warn('[ZuShé Trader] loadStrategyPool failed:', error.message || error); return []; }
    return data || [];
  }

  async function zsLoadEvolutionTrades(limit = 50) {
    const db = zsInitSupabase();
    if (!db) return [];
    const account = await zsLoadEvolutionAccount();
    if (!account) return [];
    const { data, error } = await db.from('trader_paper_trades').select('*').eq('account_id', account.id)
      .order('entry_time', { ascending: false }).limit(limit);
    if (error) { console.warn('[ZuShé Trader] loadEvolutionTrades failed:', error.message || error); return []; }
    return data || [];
  }

  // Triggers one real evolution-engine cycle right now (the same function
  // a server cron already calls periodically) — updates each genome's
  // stats, retires/spawns if every active genome has enough closed trades,
  // then checks for a fresh BTC/ZAR entry. Returns the engine's own JSON
  // report, not a fabricated one.
  async function zsRunEvolutionEngine() {
    const r = await fetch(ZS_EVOLUTION_ENGINE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('Evolution engine HTTP ' + r.status));
    return j;
  }

  // ── Strategy Scorekeeper ───────────────────────────────────────────
  // Reads/writes trader_strategy_review for the PRIMARY paper account
  // (not the evolution sandbox). The strategy-review cron edge function
  // grades every strategy from its closed trades and flags losers; this
  // app never pauses anything on its own — only these two actions do:
  //   approve -> state='paused' (signal-scan stops generating that strategy)
  //   keep    -> state='active', dismissed until RE_REVIEW_AFTER more
  //              closed trades so the same flag doesn't reappear every cycle
  async function zsLoadStrategyReview() {
    const db = zsInitSupabase();
    if (!db) return [];
    const account = zsAccount || await zsEnsureAccount();
    if (!account) return [];
    const { data, error } = await db.from('trader_strategy_review').select('*').eq('account_id', account.id)
      .order('state', { ascending: true }).order('strategy', { ascending: true });
    if (error) { console.warn('[ZuShé Trader] loadStrategyReview failed:', error.message || error); return []; }
    return data || [];
  }

  async function zsDecideStrategyReview(strategy, decision) {
    const db = zsInitSupabase();
    if (!db) return null;
    const account = zsAccount || await zsEnsureAccount();
    if (!account) return null;
    const patch = { decided_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    if (decision === 'approve') {
      patch.state = 'paused';
    } else if (decision === 'keep') {
      const { data: row } = await db.from('trader_strategy_review').select('closed_trades')
        .eq('account_id', account.id).eq('strategy', strategy).maybeSingle();
      patch.state = 'active';
      patch.flag_reason = null;
      patch.flagged_at = null;
      patch.dismissed_at_trades = Number(row?.closed_trades || 0);
    } else {
      throw new Error('Unknown decision: ' + decision);
    }
    const { data, error } = await db.from('trader_strategy_review').update(patch)
      .eq('account_id', account.id).eq('strategy', strategy).select().maybeSingle();
    if (error) throw error;
    return data;
  }

  // Upserts a paper trade (open or closed) into trader_paper_trades.
  // trader_paper_trades has: id(uuid, server-generated by default), account_id,
  // strategy, pair, timeframe, direction(BUY|SELL), status(OPEN|CLOSED|CANCELLED),
  // entry_price, stop_price, take_profit, quantity, risk_amount, gross_pnl, fees,
  // net_pnl, entry_time, exit_time, exit_price, exit_reason, metadata(jsonb).
  // The app assigns its own uuid (trade.dbId) at open so the later close can
  // target the same row with a plain UPDATE instead of relying on a returned id.
  async function zsOpenTrade(trade) {
    const db = zsInitSupabase();
    if (!db || !trade || !trade.dbId) return;
    const account = zsAccount || await zsEnsureAccount();
    const payload = {
      id: trade.dbId,
      account_id: account?.id || null,
      strategy: trade.strategy || 'Combined',
      pair: trade.pair,
      timeframe: PAPER_CONFIG.timeframe,
      direction: trade.dir,
      status: 'OPEN',
      entry_price: Number(trade.entry) || 0,
      stop_price: Number(trade.sl) || 0,
      take_profit: Number(trade.tp) || 0,
      quantity: Number(trade.size) || 0,
      risk_amount: Number(trade.risk) || 0,
      entry_time: new Date(trade.openedAt || Date.now()).toISOString(),
      metadata: { local_id: trade.id, confidence: Number(trade.confidence || 0) }
    };
    const { error } = await db.from('trader_paper_trades').insert(payload);
    if (error) console.warn('[ZuShé Trader] openTrade failed:', error.message || error);
  }

  async function zsCloseTrade(trade) {
    const db = zsInitSupabase();
    if (!db || !trade || !trade.dbId) return;
    const pl = Number(trade.pl || 0);
    const grossPl = trade.grossPl != null ? Number(trade.grossPl) : pl;
    const fee = Number(trade.fee || 0);
    const slip = Number(trade.slip || 0);
    const payload = {
      status: 'CLOSED',
      exit_price: Number(trade.exit) || null,
      exit_time: trade.closeTime ? new Date(trade.closeTime).toISOString() : new Date().toISOString(),
      exit_reason: trade.trigger || trade.exitReason || 'Manual close',
      gross_pnl: grossPl,
      fees: fee,
      slippage_cost: slip,
      net_pnl: pl
    };
    const ent = Number(trade.entry), ex = Number(trade.exit);
    if (ent > 0 && ex > 0 && Math.abs(ex / ent - 1) > 0.5) {
      throw new Error('Refusing to save a close price more than 50% away from entry (' + ex + ' vs ' + ent + ')');
    }
    const { error } = await db.from('trader_paper_trades').update(payload).eq('id', trade.dbId);
    if (error) { console.warn('[ZuShé Trader] closeTrade failed:', error.message || error); throw error; }
  }

  // Rebuilds balance/equity/realized/daily P&L from the sum of every closed trade. Idempotent.
  async function zsRecomputeAccount() {
    const db = zsInitSupabase();
    if (!db) return null;
    const account = zsAccount || await zsEnsureAccount();
    const { data, error } = await db.from('trader_paper_trades').select('net_pnl,exit_time')
      .eq('account_id', account.id).eq('status', 'CLOSED').limit(5000);
    if (error) throw error;
    const tz = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Africa/Johannesburg' });
    const today = tz(Date.now());
    let sum = 0, daily = 0;
    (data || []).forEach(t => {
      const p = Number(t.net_pnl) || 0; sum += p;
      if (t.exit_time && tz(t.exit_time) === today) daily += p;
    });
    const balance = parseFloat(((Number(account.starting_balance) || 10000) + sum).toFixed(2));
    return zsPersistAccount({ balance, equity: balance, realized_pnl: parseFloat(sum.toFixed(2)), daily_pnl: parseFloat(daily.toFixed(2)) });
  }

  // ---- Signal Desk (server-generated signals) ----------------------
  // Reads the rows the signal-scan cron writes to trader_signals, most
  // recent first. Signal Desk maps each row onto its UI shape client-side
  // (mapDbSignalToUi) so the existing card rendering keeps working.
  async function zsLoadSignals() {
    const db = zsInitSupabase();
    if (!db) return [];
    const account = zsAccount || await zsEnsureAccount();
    const { data, error } = await db.from('trader_signals')
      .select('*')
      .eq('account_id', account?.id || null)
      .neq('direction', 'NO TRADE')
      .order('created_at', { ascending: false })
      .limit(10000);
    if (error) { console.warn('[ZuShé Trader] loadSignals failed:', error.message || error); return []; }
    return data || [];
  }

  async function zsDecideSignal(id, status, reason) {
    const db = zsInitSupabase();
    if (!db || !id) return;
    const payload = { status, decided_at: new Date().toISOString() };
    if (reason) payload.decision_reason = reason;
    const { error } = await db.from('trader_signals').update(payload).eq('id', id);
    if (error) console.warn('[ZuShé Trader] decideSignal failed:', error.message || error);
  }

  // Deletes a batch of signal rows by id — used by the Settings "clear
  // history" controls (per sub-tab and clear-all). Never touches
  // trader_paper_trades, so open/closed position history is unaffected.
  async function zsDeleteSignals(ids) {
    const db = zsInitSupabase();
    if (!db || !ids || !ids.length) return { deleted: 0 };
    const { error } = await db.from('trader_signals').delete().in('id', ids);
    if (error) { console.warn('[ZuShé Trader] deleteSignals failed:', error.message || error); throw error; }
    return { deleted: ids.length };
  }

  // Telegram screenshot -> signal. The edge function reads the image with
  // vision, extracts the trade call and inserts it into trader_signals with
  // source:'telegram'. Needs the ANTHROPIC_API_KEY secret on the project.
  async function zsSubmitTelegramSignal(imageBase64, mediaType, sourceLabel) {
    const res = await fetch(`${ZS_SUPABASE_URL}/functions/v1/telegram-signal-parse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_base64: imageBase64, media_type: mediaType, source_label: sourceLabel })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok && !j.error) j.error = 'Parser HTTP ' + res.status;
    return j;
  }

  // Write-only secret intake (Gemini key for the screenshot parser). The value
  // goes to the save-secret edge function and lands in a table the app cannot
  // read back; the app only ever learns whether a key is configured.
  async function zsSecretCall(payload) {
    const res = await fetch(`${ZS_SUPABASE_URL}/functions/v1/save-secret`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok && !j.error) j.error = 'HTTP ' + res.status;
    return j;
  }
  const zsGetSecretStatus = (name) => zsSecretCall({ action: 'status', name });
  const zsSaveSecret = (name, value) => zsSecretCall({ action: 'set', name, value });
  const zsClearSecret = (name) => zsSecretCall({ action: 'clear', name });

  // ---- Broker Connection (real, but nothing auto-fires) -----------------
  // Trading key: id+secret verified against Luno's own /api/1/balance by
  // save-secret before it is stored, same write-only pattern as the Gemini
  // key above — the app can only ever ask "is it configured?".
  const zsSaveTradeKey = (id, secret) => zsSaveSecret('luno_trade_key', JSON.stringify({ id, secret }));
  const zsGetTradeKeyStatus = () => zsGetSecretStatus('luno_trade_key');
  const zsClearTradeKey = () => zsClearSecret('luno_trade_key');

  // trader_system_flags is world-writable to this single-user app already
  // (see saveLunoKey above) — the live-trading gates that actually matter
  // (kill switch, live_trading_enabled, the order cap, whether a trading
  // key exists) are re-checked server-side in broker-order regardless of
  // what the client sends, so this is just the same direct-upsert pattern
  // everything else in Settings already uses.
  async function zsUpdateSystemFlags(patch) {
    const db = zsInitSupabase();
    if (!db) throw new Error('Supabase not available');
    const { error } = await db.from('trader_system_flags')
      .upsert({ owner_key: ZS_SYSTEM_KEY, ...patch }, { onConflict: 'owner_key' });
    if (error) throw error;
  }

  async function zsBrokerCall(payload) {
    const res = await fetch(`${ZS_SUPABASE_URL}/functions/v1/broker-order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok && !j.error) j.error = 'HTTP ' + res.status;
    return j;
  }
  // Every real-money gate (kill switch, live_trading_enabled, order cap,
  // key presence) is enforced again inside broker-order itself — this call
  // cannot skip them just because the client thinks it's ready.
  const zsPlaceLiveOrder = (pair, direction, zarAmount) => zsBrokerCall({ action: 'place', pair, direction, zar_amount: zarAmount });
  const zsListLiveOrders = () => zsBrokerCall({ action: 'list' });

  async function zsPersistAccount(patch) {
    const db = zsInitSupabase();
    if (!db) return;
    const account = zsAccount || await zsEnsureAccount();
    const { data, error } = await db
      .from('trader_paper_accounts')
      .update(Object.assign({}, patch, { updated_at: new Date().toISOString() }))
      .eq('id', account.id)
      .select()
      .single();
    if (error) throw error;
    zsAccount = data;
    return data;
  }

  // ---- Push notifications -----------------------------------------
  // Real Web Push: service worker + pushManager subscription, stored in
  // trader_push_subscriptions (publicly writable by anon, same as every
  // other trader_* table — this is a single-user private install). The
  // VAPID private key never reaches the client; it lives only in
  // trader_push_config behind the push-vapid-key / push-send edge
  // functions.
  let zsSwReg = null;

  function zsUrlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  async function zsRegisterSW() {
    if (!('serviceWorker' in navigator)) return null;
    if (zsSwReg) return zsSwReg;
    try {
      zsSwReg = await navigator.serviceWorker.register('sw.js');
      return zsSwReg;
    } catch (e) {
      console.warn('[ZuShé Trader] service worker registration failed:', e?.message || e);
      return null;
    }
  }

  async function zsGetPushSubscription() {
    const reg = await zsRegisterSW();
    if (!reg) return null;
    return reg.pushManager.getSubscription();
  }

  async function zsSubscribePush(prefs) {
    if (!('Notification' in window) || !('PushManager' in window)) {
      throw new Error('Push notifications are not supported in this browser.');
    }
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') throw new Error('Notification permission was not granted.');

    const reg = await zsRegisterSW();
    if (!reg) throw new Error('Service worker unavailable — push cannot be enabled.');

    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const keyRes = await fetch(`${ZS_SUPABASE_URL}/functions/v1/push-vapid-key`);
      if (!keyRes.ok) throw new Error('Could not fetch the push key from the server.');
      const { publicKey } = await keyRes.json();
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: zsUrlBase64ToUint8Array(publicKey)
      });
    }

    const json = sub.toJSON();
    const db = zsInitSupabase();
    const { error } = await db.from('trader_push_subscriptions').upsert({
      owner_key: ZS_OWNER_KEY,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth,
      prefs: prefs || { trades: true, risk: true, evolution: true },
      user_agent: navigator.userAgent,
      updated_at: new Date().toISOString()
    }, { onConflict: 'endpoint' });
    if (error) throw error;
    return sub;
  }

  async function zsUpdatePushPrefs(prefs) {
    const sub = await zsGetPushSubscription();
    if (!sub) return;
    const db = zsInitSupabase();
    const { error } = await db.from('trader_push_subscriptions')
      .update({ prefs, updated_at: new Date().toISOString() })
      .eq('endpoint', sub.endpoint);
    if (error) console.warn('[ZuShé Trader] updatePushPrefs failed:', error.message || error);
  }

  async function zsUnsubscribePush() {
    const sub = await zsGetPushSubscription();
    if (!sub) return;
    const db = zsInitSupabase();
    try { await db.from('trader_push_subscriptions').delete().eq('endpoint', sub.endpoint); } catch (_e) { /* ignore */ }
    await sub.unsubscribe();
  }

  window.ZuShePaperDB = {
    init: zsInitSupabase,
    ensureAccount: zsEnsureAccount,
    saveSettings: zsSaveSettings,
    getSystemFlags: zsGetSystemFlags,
    saveLunoKey: zsSaveLunoKey,
    saveCandles: zsSaveCandles,
    saveSignal: zsSaveSignal,
    loadTrades: zsLoadTrades,
    openTrade: zsOpenTrade,
    closeTrade: zsCloseTrade,
    loadSignals: zsLoadSignals,
    decideSignal: zsDecideSignal,
    deleteSignals: zsDeleteSignals,
    submitTelegramSignal: zsSubmitTelegramSignal,
    getSecretStatus: zsGetSecretStatus,
    saveSecret: zsSaveSecret,
    clearSecret: zsClearSecret,
    persistAccount: zsPersistAccount,
    recomputeAccount: zsRecomputeAccount,
    getAccount: () => zsAccount,
    getPushSubscription: zsGetPushSubscription,
    subscribePush: zsSubscribePush,
    unsubscribePush: zsUnsubscribePush,
    updatePushPrefs: zsUpdatePushPrefs,
    loadEvolutionAccount: zsLoadEvolutionAccount,
    loadStrategyPool: zsLoadStrategyPool,
    loadEvolutionTrades: zsLoadEvolutionTrades,
    runEvolutionEngine: zsRunEvolutionEngine,
    loadStrategyReview: zsLoadStrategyReview,
    decideStrategyReview: zsDecideStrategyReview,
    saveTradeKey: zsSaveTradeKey,
    getTradeKeyStatus: zsGetTradeKeyStatus,
    clearTradeKey: zsClearTradeKey,
    updateSystemFlags: zsUpdateSystemFlags,
    placeLiveOrder: zsPlaceLiveOrder,
    listLiveOrders: zsListLiveOrders
  };

  window.addEventListener('load', async () => {
    try {
      await zsEnsureAccount();
      await zsSaveSettings();
      console.info('[ZuShé Trader] Supabase paper persistence connected.');
    } catch (err) {
      console.warn('[ZuShé Trader] Supabase persistence unavailable:', err?.message || err);
    }
    // Register the push service worker eagerly so a subscription already
    // exists by the time the user opens Settings. Does not itself ask for
    // notification permission — that only happens when the user flips the
    // Push Notifications toggle.
    zsRegisterSW().catch(() => {});
  });
})();
</script>

</body>
