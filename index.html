<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#080C0B"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ZuShé Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   ZEDAYCH SIGNAL — DESIGN TOKENS
   Private AI Trading Intelligence System
═══════════════════════════════════════════════ */
:root{
  --bg:#080C0B;
  --bg2:#0D1412;
  --bg3:#111918;
  --bg4:#161F1D;
  --surface:rgba(16,24,22,.92);
  --glass:rgba(255,255,255,.04);
  --glass2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.14);
  --cyan:#00E5CC;
  --cyan2:#00B5A0;
  --cyan-dim:rgba(0,229,204,.12);
  --green:#10D97A;
  --green2:#0BAF62;
  --green-dim:rgba(16,217,122,.10);
  --red:#FF3D5A;
  --red2:#CC2040;
  --red-dim:rgba(255,61,90,.10);
  --amber:#FFB020;
  --amber-dim:rgba(255,176,32,.10);
  --purple:#8B7FFF;
  --purple-dim:rgba(139,127,255,.10);
  --text:#E8F0EE;
  --text2:#7A9490;
  --text3:#3D5450;
  --font:'Syne',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:16px;--rsm:10px;--rlg:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── Scrollable content ── */
.screen{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.scroll::-webkit-scrollbar{display:none}

/* ── App shell ── */
.app{max-width:480px;margin:0 auto;height:100vh;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 500px 400px at 20% 0%,rgba(0,229,204,.06),transparent 60%),
             radial-gradient(ellipse 400px 350px at 90% 20%,rgba(16,217,122,.05),transparent 60%),
             var(--bg)}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
  background:rgba(8,12,11,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);flex-shrink:0;position:sticky;top:0;z-index:50}
.hdr-logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:28px;height:28px;flex-shrink:0}
.logo-text{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo-za{background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sig{background:linear-gradient(135deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-family:var(--mono);font-size:8px;color:var(--text3);letter-spacing:1.5px;display:block;margin-top:-1px}
.mode-badge{font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.badge-demo{background:rgba(255,176,32,.12);color:var(--amber);border:1px solid rgba(255,176,32,.25)}
.badge-live{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,217,122,.3)}
.badge-off{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,61,90,.25)}

/* ── Bottom nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(8,12,11,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);z-index:100;padding:0 0 env(safe-area-inset-bottom,0px);display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 14px;border:none;background:none;color:var(--text3);
  font-family:var(--font);font-size:9px;font-weight:700;letter-spacing:.4px;
  cursor:pointer;text-transform:uppercase;transition:color .15s;position:relative}
.nb.on{color:var(--cyan)}
.nb-icon{font-size:18px;line-height:1;position:relative}
.nb.on .nb-icon::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

/* ── Section title ── */
.stit{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:2px;
  color:var(--text3);text-transform:uppercase;padding:16px 16px 8px}
.stit span{color:var(--cyan);margin-left:6px}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin:0 12px 10px;position:relative;overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.card-sm{padding:12px}
.card-flush{margin:0;border-radius:0;border-left:none;border-right:none}

/* ── Summary stat boxes ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 8px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rsm);padding:12px;position:relative;overflow:hidden}
.stat-box::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.stat-lbl{font-family:var(--mono);font-size:8.5px;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px}
.stat-up{color:var(--green)}
.stat-dn{color:var(--red)}
.stat-neu{color:var(--cyan)}

/* ── Row ── */
.row{display:flex;justify-content:space-between;align-items:center}
.row+.row{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:var(--rsm);padding:11px 16px;font-family:var(--font);
  font-weight:700;font-size:13px;cursor:pointer;transition:all .15s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#020a09;box-shadow:0 4px 20px rgba(0,229,204,.25)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#020a09;box-shadow:0 4px 20px rgba(16,217,122,.25)}
.btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.btn-amber{background:linear-gradient(135deg,var(--amber),#cc8800);color:#0a0600}
.btn-ghost{background:var(--glass2);color:var(--text2);border:1px solid var(--border)}
.btn-outline{background:transparent;color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 16px rgba(0,229,204,.08)}
.btn-sm{padding:7px 12px;font-size:11px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:10px;border-radius:6px;width:auto}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* ── Input ── */
.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);
  border-radius:var(--rsm);padding:11px 14px;color:var(--text);font-family:var(--font);
  font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cyan)}
.inp::placeholder{color:var(--text3)}
select.inp{cursor:pointer}textarea.inp{resize:none}
.inp-lbl{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px;margin-bottom:4px}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;padding:0 12px 12px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;border:none;font-family:var(--font);font-size:11px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;
  background:var(--glass);color:var(--text3);border:1px solid transparent}
.tab.on{background:rgba(0,229,204,.1);color:var(--cyan);border-color:rgba(0,229,204,.3)}

/* ── Toggle ── */
.tgl{display:flex;background:var(--glass);border-radius:8px;padding:3px}
.tgl-btn{flex:1;padding:6px;border-radius:6px;border:none;font-family:var(--font);font-size:11px;
  font-weight:700;cursor:pointer;color:var(--text3);background:transparent;transition:all .15s}
.tgl-btn.on{background:var(--cyan);color:#020a09}

/* ── Badge / pill ── */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--mono)}
.pill-buy{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,217,122,.25)}
.pill-sell{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,61,90,.25)}
.pill-watch{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,176,32,.25)}
.pill-neutral{background:var(--glass);color:var(--text2);border:1px solid var(--border)}
.pill-cyan{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(0,229,204,.25)}
.pill-purple{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(139,127,255,.25)}

/* ── Confidence bar ── */
.conf-wrap{height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--green))}

/* ── Progress bar ── */
.prog-wrap{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .8s ease}
.prog-cyan{background:linear-gradient(90deg,var(--cyan),var(--green))}
.prog-green{background:var(--green)}
.prog-red{background:var(--red)}
.prog-amber{background:var(--amber)}

/* ── Signal card ── */
.sig-card{margin:0 12px 10px;border-radius:var(--r);border:1px solid var(--border);
  background:var(--surface);overflow:hidden;position:relative}
.sig-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.sig-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.sig-body{padding:14px 14px 14px 18px}
.sig-buy .sig-accent{background:linear-gradient(180deg,var(--green),var(--cyan))}
.sig-sell .sig-accent{background:linear-gradient(180deg,var(--red),var(--amber))}
.sig-watch .sig-accent{background:var(--amber)}

/* ── Market row ── */
.mkt-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.mkt-row+.mkt-row{border-top:1px solid var(--border)}
.mkt-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mkt-name{font-weight:700;font-size:13px}
.mkt-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:1px}
.mkt-price{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right}
.mkt-change{font-size:11px;font-weight:700;text-align:right;margin-top:1px}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--text3)}

/* ── Risk meter ── */
.risk-ring{width:72px;height:72px;flex-shrink:0}

/* ── Journal / list item ── */
.list-item{padding:12px 0;display:flex;align-items:center;gap:12px}
.list-item+.list-item{border-top:1px solid var(--border)}
.list-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Toast ── */
.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:90%;max-width:340px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:toastIn .2s ease;width:100%}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* ── Modal ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--bg2);border-top:1px solid var(--border2);border-radius:24px 24px 0 0;
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px 16px 48px}
.mod::-webkit-scrollbar{display:none}
.mod-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.mod-title{font-size:17px;font-weight:800;margin-bottom:4px}
.mod-sub{font-size:12px;color:var(--text3);margin-bottom:16px}

/* ── Switch ── */
.sw-wrap{display:flex;justify-content:space-between;align-items:center;padding:11px 0}
.sw-wrap+.sw-wrap{border-top:1px solid var(--border)}
.sw-lbl{font-size:13px}
.sw-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-slider{position:absolute;inset:0;background:var(--glass2);border-radius:12px;cursor:pointer;transition:.2s}
.sw-slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--text3);transition:.2s}
.sw input:checked+.sw-slider{background:var(--cyan)}
.sw input:checked+.sw-slider::before{transform:translateX(18px);background:#020a09}

/* ── Equity curve simple ── */
.eq-line{stroke:var(--cyan);stroke-width:2;fill:none;filter:drop-shadow(0 0 4px var(--cyan))}
.eq-area{fill:url(#eqGrad);opacity:.3}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:10px}
.empty-icon{font-size:40px;opacity:.4}
.empty-title{font-size:14px;font-weight:700;color:var(--text2)}
.empty-sub{font-size:12px;color:var(--text3);line-height:1.6}

/* ── Spinner ── */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}

/* ── Score ring ── */
.score-ring{display:flex;align-items:center;justify-content:center;flex-direction:column;
  width:64px;height:64px;border-radius:50%;border:2px solid var(--cyan);
  box-shadow:0 0 16px rgba(0,229,204,.3);flex-shrink:0}
.score-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--cyan);line-height:1}
.score-lbl{font-size:8px;color:var(--text3);margin-top:1px}

/* ── Separator ── */
.sep{height:1px;background:var(--border);margin:12px 0}

/* ── Disclaimer ── */
.disc{font-size:10px;color:var(--text3);line-height:1.6;padding:8px 12px;text-align:center}

/* ── Page header ── */
.pg-hdr{padding:14px 16px 8px}
.pg-title{font-size:19px;font-weight:800;letter-spacing:-.3px}
.pg-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--mono);letter-spacing:.5px}

/* ── Animations ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(0,229,204,.3)}50%{box-shadow:0 0 28px rgba(0,229,204,.6)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;animation:pulse 1.5s infinite}
.live-dot.red{background:var(--red)}
.live-dot.amber{background:var(--amber)}

/* ── Detail row ── */
.d-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px}
.d-row+.d-row{border-top:1px solid var(--border)}
.d-lbl{color:var(--text3)}
.d-val{font-family:var(--mono);font-weight:600}

/* ── Strategy card ── */
.strat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin:0 12px 10px;position:relative;overflow:hidden}
.strat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.strat-score-badge{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:11px;
  font-weight:700;padding:3px 8px;border-radius:6px}

/* ── Evolution progress ── */
.evo-stage{display:flex;align-items:center;gap:10px;padding:10px 0}
.evo-stage+.evo-stage{border-top:1px solid var(--border)}
.evo-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;flex-shrink:0}
.evo-active{background:var(--cyan);color:#020a09}
.evo-done{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,217,122,.3)}
.evo-pending{background:var(--glass);color:var(--text3);border:1px solid var(--border)}
.evo-lbl{font-size:13px;font-weight:600}
.evo-sub{font-size:11px;color:var(--text3);margin-top:1px}

/* ── Chart container ── */
.chart-wrap{width:100%;overflow:hidden;position:relative}

/* ── Settings section ── */
.settings-section{margin:0 12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.settings-hdr{padding:12px 14px;background:var(--glass);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);font-family:var(--mono);letter-spacing:1.5px;text-transform:uppercase}
.settings-row{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.settings-row+.settings-row{border-top:1px solid var(--border)}
.settings-lbl{font-size:13px;font-weight:600}
.settings-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── Warning banner ── */
.warn-banner{margin:0 12px 10px;padding:12px 14px;background:var(--red-dim);border:1px solid rgba(255,61,90,.25);border-radius:var(--rsm);display:flex;align-items:flex-start;gap:10px}
.warn-icon{font-size:18px;flex-shrink:0;margin-top:-1px}
.warn-text{font-size:12px;color:var(--text2);line-height:1.6}

/* ── Info banner ── */
.info-banner{margin:0 12px 10px;padding:12px 14px;background:var(--cyan-dim);border:1px solid rgba(0,229,204,.2);border-radius:var(--rsm);display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--text2);line-height:1.6}

/* ── Kill switch ── */
.kill-btn{background:linear-gradient(135deg,#ff0030,#cc0020);color:#fff;border:none;border-radius:var(--rsm);padding:14px;font-family:var(--font);font-weight:800;font-size:15px;width:100%;cursor:pointer;letter-spacing:.5px;box-shadow:0 0 30px rgba(255,0,48,.4);animation:glow 2s infinite}

/* ── Explain box button reset ── */
button { font-family: var(--font); }
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .45s ease}

/* ── HelpLabel tooltip z-index fix ── */
.strat-card,.card,.sig-card{overflow:visible!important}

/* ── Section header inside card ── */
.card-section-hdr{
  font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:2px;
  color:var(--text3);text-transform:uppercase;margin-bottom:10px;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<div id="root"></div>
<script>

"use strict";
const {createElement:e,useState,useEffect,useRef,useCallback,useMemo}=React;

// ═══════════════════════════════════════════
// LOCAL STORAGE
// ═══════════════════════════════════════════
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  del:(k)=>{try{localStorage.removeItem(k);}catch{}}
};

function emaSeries(values,n){
  if(!values.length)return [];
  const a=2/(n+1), out=[];
  let prev=values[0];
  values.forEach((v,i)=>{prev=i===0?v:(v*a+prev*(1-a));out.push(prev)});
  return out;
}
function rsiSeries(values,n=14){
  if(values.length<n+1)return values.map(()=>50);
  const out=new Array(values.length).fill(50);
  let gains=0,losses=0;
  for(let i=1;i<=n;i++){const d=values[i]-values[i-1];gains+=Math.max(d,0);losses+=Math.max(-d,0)}
  let ag=gains/n, al=losses/n;
  out[n]=al===0?100:100-(100/(1+ag/al));
  for(let i=n+1;i<values.length;i++){
    const d=values[i]-values[i-1],g=Math.max(d,0),l=Math.max(-d,0);
    ag=(ag*(n-1)+g)/n; al=(al*(n-1)+l)/n;
    out[i]=al===0?100:100-(100/(1+ag/al));
  }
  return out;
}
function atrSeries(candles,n=14){
  if(!candles.length)return [];
  const tr=candles.map((c,i)=>i===0?c.high-c.low:Math.max(c.high-c.low,Math.abs(c.high-candles[i-1].close),Math.abs(c.low-candles[i-1].close)));
  const out=new Array(tr.length).fill(0);
  let a=tr.slice(0,Math.min(n,tr.length)).reduce((x,y)=>x+y,0)/Math.min(n,tr.length);
  for(let i=0;i<tr.length;i++){a=i===0?a:(i<n?tr.slice(0,i+1).reduce((x,y)=>x+y,0)/(i+1):(a*(n-1)+tr[i])/n);out[i]=a}
  return out;
}
function bbSeries(values,n=20,m=2){
  return values.map((_,i)=>{
    const s=values.slice(Math.max(0,i-n+1),i+1);
    const mean=s.reduce((a,b)=>a+b,0)/s.length;
    const sd=Math.sqrt(s.reduce((a,b)=>a+(b-mean)**2,0)/s.length);
    return {mid:mean,upper:mean+m*sd,lower:mean-m*sd};
  });
}
function marketIndicators(candles){
  const closes=candles.map(c=>c.close), vols=candles.map(c=>c.volume);
  const e20=emaSeries(closes,20),e50=emaSeries(closes,50),e200=emaSeries(closes,200);
  const rsi=rsiSeries(closes,14), atr=atrSeries(candles,14), bb=bbSeries(closes,20,2);
  const i=closes.length-1, avgVol=vols.slice(-20).reduce((a,b)=>a+b,0)/Math.max(1,Math.min(20,vols.length));
  return {price:closes[i],ema20:e20[i],ema50:e50[i],ema200:e200[i],rsi:rsi[i],atr:atr[i],bb:bb[i],volume:vols[i],avgVolume:avgVol};
}
function signalEvidence(ind){
  const ev=[];
  if(ind.ema20>ind.ema50)ev.push('EMA20 above EMA50'); else ev.push('EMA20 below EMA50');
  if(ind.price>ind.ema200)ev.push('Price above EMA200'); else ev.push('Price below EMA200');
  ev.push('RSI '+ind.rsi.toFixed(1));
  if(ind.volume>ind.avgVolume*1.2)ev.push('Volume expansion');
  if(ind.atr>0)ev.push('ATR '+ind.atr.toFixed(0));
  return ev;
}
function evaluatePaperSignal(candles,strategy='Combined',pair=PAPER_CONFIG.pair){
  if(candles.length<205)return {direction:'NO TRADE',confidence:0,reason:'Not enough historical candles yet.',evidence:[],pair};
  const x=marketIndicators(candles), ev=signalEvidence(x);
  const trendUp=x.price>x.ema200&&x.ema20>x.ema50;
  const trendDown=x.price<x.ema200&&x.ema20<x.ema50;
  const momentumUp=x.rsi>=55&&x.rsi<=72;
  const momentumDown=x.rsi<=45&&x.rsi>=28;
  const volumeOk=x.volume>=x.avgVolume*0.8;
  const meanLong=x.price<x.bb.lower&&x.rsi<35;
  const meanShort=x.price>x.bb.upper&&x.rsi>65;
  let direction='NO TRADE', confidence=0, reason='Conditions are not aligned.';
  if(strategy==='Trend'){
    if(trendUp&&volumeOk){direction='BUY';confidence=72;reason='Trend alignment: price/EMA structure is bullish.'}
    else if(trendDown&&volumeOk){direction='SELL';confidence=72;reason='Trend alignment: price/EMA structure is bearish.'}
  }else if(strategy==='Momentum'){
    if(momentumUp&&volumeOk&&trendUp){direction='BUY';confidence=70;reason='Momentum and trend agree.'}
    else if(momentumDown&&volumeOk&&trendDown){direction='SELL';confidence=70;reason='Downside momentum and trend agree.'}
  }else if(strategy==='Mean Reversion'){
    if(meanLong){direction='BUY';confidence=68;reason='Price is extended below the lower Bollinger Band with RSI weakness.'}
    else if(meanShort){direction='SELL';confidence=68;reason='Price is extended above the upper Bollinger Band with RSI strength.'}
  }else{
    if(trendUp&&momentumUp&&volumeOk){direction='BUY';confidence=78;reason='Combined trend, momentum and volume confirmation.'}
    else if(trendDown&&momentumDown&&volumeOk){direction='SELL';confidence=78;reason='Combined bearish trend, momentum and volume confirmation.'}
  }
  return {direction,confidence,reason,evidence:ev,price:x.price,stopDistance:Math.max(x.atr*1.5,x.price*0.008),indicators:x,timestamp:Date.now(),pair,strategy};
}
// Cape Town-local calendar day, used so "daily" loss/streak tracking actually
// means today rather than an all-time total that never resets.
function paperTzDate(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'}); }

// Single place that updates the paper risk stats after ANY trade closes,
// whether closed locally (checkExits) or discovered via server reconciliation.
// Previously these stats were written once at reset (frozen at zero) and never
// touched again, so the daily-loss / consecutive-loss gate below could never
// actually trip from real trading activity. This fixes that.
function recordPaperTradeResult(pl){
  const today=paperTzDate();
  const raw=paperLoad(PAPER_LS.stats,{dailyLoss:0,lossStreak:0,totalPnL:0,date:today});
  const base=raw.date===today?raw:{dailyLoss:0,lossStreak:0,totalPnL:raw.totalPnL||0,date:today};
  const updated={
    dailyLoss:parseFloat((base.dailyLoss+pl).toFixed(2)),
    lossStreak:pl<0?(base.lossStreak||0)+1:0,
    totalPnL:parseFloat(((base.totalPnL||0)+pl).toFixed(2)),
    date:today
  };
  paperSave(PAPER_LS.stats,updated);
  return updated;
}

function paperRiskAllowed(stats,account){
  const today=paperTzDate();
  const s=stats&&stats.date===today?stats:{dailyLoss:0,lossStreak:0};
  if((account.openPositions||[]).filter(p=>p.paper).length>=PAPER_CONFIG.maxOpenTrades)return {ok:false,reason:'Maximum open paper positions reached.'};
  if((s.dailyLoss||0)<=-(PAPER_CONFIG.startingBalance*PAPER_CONFIG.maxDailyLoss))return {ok:false,reason:'Daily loss limit reached.'};
  if((s.lossStreak||0)>=PAPER_CONFIG.maxConsecutiveLosses)return {ok:false,reason:'Consecutive-loss circuit breaker active.'};
  return {ok:true};
}
const ZS_BUILD='2026-09-25.2';
// Sizing base is capped so a corrupted/inflated balance can never produce absurd position sizes.
function paperSizingBalance(b){const n=Number(b);return Number.isFinite(n)&&n>0?Math.min(n,200000):10000;}
function paperPositionSize(balance,entry,stop){
  const risk=paperSizingBalance(balance)*PAPER_CONFIG.riskPerTrade;
  const distance=Math.abs(entry-stop);
  return distance>0?risk/distance:0;
}
function createPaperPosition(signal,balance){
  if(signal.direction==='NO TRADE')return null;
  const entry=signal.direction==='BUY'?signal.price*(1+PAPER_CONFIG.slippageBps/10000):signal.price*(1-PAPER_CONFIG.slippageBps/10000);
  const stop=signal.direction==='BUY'?entry-signal.stopDistance:entry+signal.stopDistance;
  const tp=signal.direction==='BUY'?entry+signal.stopDistance*2:entry-signal.stopDistance*2;
  return {
    id:'PT-'+Date.now(),dbId:zsGenId(),pair:signal.pair,dir:signal.direction,entry,sl:stop,tp,
    size:paperPositionSize(balance,entry,stop),risk:paperSizingBalance(balance)*PAPER_CONFIG.riskPerTrade,
    strategy:signal.strategy,confidence:signal.confidence,openedAt:Date.now(),paper:true
  };
}
// Checks a real open paper position against a freshly-fetched live price.
// Returns null while neither stop nor target has been reached; otherwise
// returns the real exit price and outcome — never a randomised result.
function evaluatePaperExit(pos,lastPrice){
  if(!pos||!Number.isFinite(lastPrice)||lastPrice<=0)return null;
  if(pos.dir==='BUY'){
    if(lastPrice<=pos.sl)return {exitPrice:pos.sl,status:'Loss',trigger:'Stop-loss'};
    if(lastPrice>=pos.tp)return {exitPrice:pos.tp,status:'Win',trigger:'Take-profit'};
  }else{
    if(lastPrice>=pos.sl)return {exitPrice:pos.sl,status:'Loss',trigger:'Stop-loss'};
    if(lastPrice<=pos.tp)return {exitPrice:pos.tp,status:'Win',trigger:'Take-profit'};
  }
  return null;
}
async function runPaperEngine(strategy='Combined',pair=PAPER_CONFIG.pair){
  const candles=await DataProviders.luno.getCandles(pair,PAPER_CONFIG.timeframe,PAPER_CONFIG.candleLimit);
  const ticker=await DataProviders.luno.getTicker(pair);
  const lastPrice=Number(ticker.last_trade||ticker.last||0);
  const snapshot={candles,lastPrice,updatedAt:Date.now(),pair};
  paperSave(PAPER_LS.market,snapshot);
  const signal=evaluatePaperSignal(candles,strategy,pair);
  paperSave(PAPER_LS.signal,signal);
  return {candles,ticker,lastPrice,signal};
}
// Scans every pair in the watchlist and ranks the resulting signals by
// confidence. This is the "opportunity scanner" for the crypto/Luno slice —
// same indicators and evaluatePaperSignal logic, just run across more than
// one instrument. Sequential fetches (not Promise.all) to stay gentle on
// Luno's public rate limits from a mobile connection.
async function scanWatchlist(strategy='Combined'){
  const results=[];
  for(const w of PAPER_CONFIG.watchlist){
    try{
      const candles=await DataProviders.luno.getCandles(w.id,PAPER_CONFIG.timeframe,PAPER_CONFIG.candleLimit);
      const ticker=await DataProviders.luno.getTicker(w.id);
      const lastPrice=Number(ticker.last_trade||ticker.last||0);
      const signal=evaluatePaperSignal(candles,strategy,w.id);
      results.push({...signal,label:w.label,lastPrice,ok:true});
    }catch(err){
      results.push({pair:w.id,label:w.label,direction:'NO TRADE',confidence:0,reason:'Data unavailable: '+(err?.message||'network error'),evidence:[],ok:false});
    }
  }
  results.sort((a,b)=>(b.confidence||0)-(a.confidence||0));
  paperSave(PAPER_LS.scan,{results,updatedAt:Date.now()});
  return results;
}
function paperReset(){
  paperSave(PAPER_LS.market,{candles:[],lastPrice:0,updatedAt:0});
  paperSave(PAPER_LS.signal,{direction:'NO TRADE',confidence:0,reason:'Paper engine reset.',evidence:[]});
  paperSave(PAPER_LS.trades,[]);
  paperSave(PAPER_LS.stats,{dailyLoss:0,lossStreak:0,totalPnL:0,date:paperTzDate()});
  paperSave(PAPER_LS.scan,{results:[],updatedAt:0});
}

function MiniEquity({data,color,height=60}){
  if(!data||data.length<2)return null;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const w=300,h=height,pad=4;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*(w-pad*2)+pad},${h-pad-((v-mn)/rng)*(h-pad*2)}`).join(' ');

    e('defs',null,e('linearGradient',{id:'eq',x1:'0',y1:'0',x2:'0',y2:'1'},

// Compact inline label with explanation tooltip
function HelpLabel({label,help,color}){
  const[show,setShow]=useState(false);
  const[pos,setPos]=useState({top:0,left:0,width:220});
  const btnRef=useRef(null);
  const toggle=ev=>{
    ev.stopPropagation();
    if(!show&&btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      const vw=window.innerWidth;
      const tipWidth=Math.min(220,vw-24);
      let left=r.left;
      if(left+tipWidth>vw-12)left=vw-tipWidth-12;
      if(left<12)left=12;
      setPos({top:r.bottom+6,left,width:tipWidth});
    }
    setShow(s=>!s);
  };
  return e('div',{style:{position:'relative',display:'inline-flex',alignItems:'center',gap:4}},
    e('span',{style:{fontSize:9,fontFamily:'var(--mono)',color:color||'var(--text3)',letterSpacing:1.5,textTransform:'uppercase'}},label),
    e('span',{
      ref:btnRef,
      onClick:toggle,
      style:{width:14,height:14,borderRadius:7,background:'var(--glass2)',border:'1px solid var(--border)',
        display:'inline-flex',alignItems:'center',justifyContent:'center',
        fontSize:9,color:'var(--text3)',cursor:'pointer',flexShrink:0}
    },'?'),
    // position:fixed (not absolute) so this escapes .stat-box's
    // overflow:hidden — which was silently clipping the tooltip text —
    // and its left offset is measured + clamped against the real screen
    // width so it can't run off either edge on narrow phones.
    show&&e('div',{
      onClick:()=>setShow(false),
      style:{position:'fixed',top:pos.top,left:pos.left,zIndex:200,background:'var(--bg3)',border:'1px solid var(--border2)',
        borderRadius:10,padding:'10px 12px',fontSize:11,color:'var(--text2)',lineHeight:1.6,
        width:pos.width,boxShadow:'0 8px 32px rgba(0,0,0,.6)'}
    },help)
  );
}

// PAPER ENGINE CARD
// ═══════════════════════════════════════════
function PaperEngineCard({account,setAccount,showToast}){
  const[pair,setPair]=useState(()=>paperLoad(PAPER_LS.watchPair,PAPER_CONFIG.pair));
  const[signal,setSignal]=useState(()=>paperLoad(PAPER_LS.signal,{direction:'NO TRADE',confidence:0,reason:'Run the paper engine to evaluate the market.',evidence:[]}));
  const[busy,setBusy]=useState(false);
  const[scanning,setScanning]=useState(false);
  const[market,setMarket]=useState(()=>paperLoad(PAPER_LS.market,{lastPrice:0,updatedAt:0,pair:PAPER_CONFIG.pair}));
  const[scan,setScan]=useState(()=>paperLoad(PAPER_LS.scan,{results:[],updatedAt:0}));
  const[sentiment,setSentiment]=useState(()=>paperLoad(PAPER_LS.sentiment,null));
  const[dataOk,setDataOk]=useState(true);
  const[auto,setAuto]=useState(false);

  const label=(PAPER_CONFIG.watchlist.find(w=>w.id===pair)||{}).label||pair;

  // Checks every open *real* paper position against a freshly-fetched price
  // and closes it at the actual stop/target if reached. No randomised P/L.
  const checkExits=useCallback((forPair,lastPrice)=>{
    const openPaper=(account.openPositions||[]).filter(p=>p.paper&&p.pair===forPair);
    if(!openPaper.length)return;
    openPaper.forEach(pos=>{
      const exit=evaluatePaperExit(pos,lastPrice);
      if(!exit)return;
      const pl=parseFloat(((pos.dir==='BUY'?(exit.exitPrice-pos.entry):(pos.entry-exit.exitPrice))*(pos.size||0)).toFixed(2));
      const newBalance=parseFloat((account.balance+pl).toFixed(2));
      const newDailyPL=parseFloat(((account.dailyPL||0)+pl).toFixed(2));
      const trade={...pos,exit:exit.exitPrice,pl,closeTime:new Date().toISOString(),status:exit.status,trigger:exit.trigger};
      recordPaperTradeResult(pl);
      setAccount(a=>({...a,
        balance:newBalance,
        equity:newBalance,
        dailyPL:newDailyPL,
        openPositions:(a.openPositions||[]).filter(p=>p.id!==pos.id),
        closedTrades:[trade,...(a.closedTrades||[])],
        used:parseFloat(Math.max(0,(a.used||0)-pos.risk).toFixed(2))
      }));
      zsSettleClose(trade,setAccount);
      showToast((exit.status==='Win'?'🟢 Paper '+exit.trigger.toLowerCase()+' hit: +':'🔴 Paper '+exit.trigger.toLowerCase()+' hit: ')+fmtCur(Math.abs(pl)),exit.status==='Win'?'success':'error');
    });
  },[account,setAccount,showToast]);

  const run=async(targetPair=pair)=>{
    if(busy)return;
    setBusy(true);
    try{
      const r=await runPaperEngine('Combined',targetPair);
      setSignal(r.signal); setMarket({lastPrice:r.lastPrice,updatedAt:Date.now(),pair:targetPair});
      setDataOk(true);
      checkExits(targetPair,r.lastPrice);
      window.ZuShePaperDB?.saveSignal?.(r.signal)?.catch?.(()=>{});
      window.ZuShePaperDB?.saveCandles?.(r.candles)?.catch?.(()=>{});
      showToast('Paper engine updated from live Luno market data ('+label+')','success');
    }catch(err){
      setDataOk(false);
      showToast('Luno data unavailable: '+(err?.message||'network error'),'error');
    }finally{setBusy(false)}
  };

  const runScan=async()=>{
    if(scanning)return;
    setScanning(true);
    try{
      const results=await scanWatchlist('Combined');
      setScan({results,updatedAt:Date.now()});
      const best=results.find(r=>r.ok&&r.direction!=='NO TRADE');
      showToast(best?('Scan complete — best setup: '+best.label+' '+best.direction):'Scan complete — no qualifying setups right now.','info');
    }catch(err){
      showToast('Scan failed: '+(err?.message||'network error'),'error');
    }finally{setScanning(false)}
  };

  const focusPair=(id)=>{
    setPair(id); paperSave(PAPER_LS.watchPair,id);
    run(id);
  };

  const loadSentiment=async()=>{
    try{
      const s=await fetchFearGreed();
      setSentiment(s); paperSave(PAPER_LS.sentiment,s);
    }catch(err){ /* non-critical — leave last known value in place */ }
  };

  const paperTrade=()=>{
    const stats=paperLoad(PAPER_LS.stats,{dailyLoss:0,lossStreak:0,totalPnL:0});
    const gate=paperRiskAllowed(stats,account);
    if(!gate.ok){showToast(gate.reason,'error');return}
    if(signal.direction==='NO TRADE'){showToast('No trade: the strategy has not produced a valid setup.','info');return}
    const pos=createPaperPosition(signal,account.balance);
    if(!pos){showToast('Could not create paper position.','error');return}
    setAccount({...account,openPositions:[...(account.openPositions||[]),pos],used:(account.used||0)+pos.risk});
    window.ZuShePaperDB?.openTrade?.(pos)?.catch?.(()=>{});
    showToast('Paper '+signal.direction+' opened on '+label+' — no real order was sent.','success');
  };

  useEffect(()=>{ loadSentiment(); },[]);

  // (Server reconciliation now lives in App.syncFromServer.)

  useEffect(()=>{
    if(!auto)return;
    const id=setInterval(()=>run(pair),300000);
    run(pair);
    return()=>clearInterval(id);
  },[auto]);

  const c=signal.direction==='BUY'?'var(--green)':signal.direction==='SELL'?'var(--red)':'var(--amber)';
  const freshMs=Date.now()-(market.updatedAt||0);
  const liveState=!dataOk?'UNAVAILABLE':(market.updatedAt&&freshMs<15*60*1000?'LIVE · LUNO':'STALE');
  const liveColor=liveState==='LIVE · LUNO'?'var(--green)':liveState==='STALE'?'var(--amber)':'var(--red)';

  return e('div',{className:'card',style:{margin:'10px 12px 6px',border:'1px solid rgba(0,229,204,.28)',background:'linear-gradient(135deg,rgba(0,229,204,.07),rgba(16,217,122,.025))'}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
      e('div',null,
        e('div',{className:'card-section-hdr',style:{color:'var(--cyan)',marginBottom:3}},'ZUSHÉ TRADER · PAPER ENGINE'),
        e('div',{style:{fontSize:15,fontWeight:800}},label+' · 1H')
      ),
      e('div',{style:{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end'}},
        e('span',{className:'mode-badge badge-demo'},'PAPER ONLY'),
        e('span',{style:{fontSize:8,fontFamily:'var(--mono)',color:liveColor,fontWeight:700}},liveState)
      )
    ),
    e('div',{style:{display:'flex',gap:5,marginBottom:9,flexWrap:'wrap'}},
      ...PAPER_CONFIG.watchlist.map(w=>e('button',{key:w.id,onClick:()=>focusPair(w.id),disabled:busy,
        className:'btn',
        style:{flex:'1 1 auto',padding:'6px 8px',fontSize:10,fontWeight:700,
          background:w.id===pair?'rgba(0,229,204,.18)':'var(--glass2)',
          border:w.id===pair?'1px solid var(--cyan)':'1px solid transparent',color:w.id===pair?'var(--cyan)':'var(--text2)'}},
        w.label))
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}},
      e('div',{style:{background:'var(--glass2)',padding:9,borderRadius:8}},e('div',{style:{fontSize:9,color:'var(--text3)'}},'PAPER EQUITY'),e('div',{style:{fontSize:18,fontWeight:800,fontFamily:'var(--mono)'}},'R '+Number(account.balance||0).toFixed(2))),
      e('div',{style:{background:'var(--glass2)',padding:9,borderRadius:8}},e('div',{style:{fontSize:9,color:'var(--text3)'}},label),e('div',{style:{fontSize:18,fontWeight:800,fontFamily:'var(--mono)'}},market.lastPrice?Number(market.lastPrice).toLocaleString('en-ZA',{maximumFractionDigits:2}):'—'))
    ),
    sentiment?e('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:9,fontSize:10,color:'var(--text3)'}},
      e('span',null,'Crypto Fear & Greed:'),
      e('strong',{style:{color:sentiment.value>=55?'var(--green)':sentiment.value<=45?'var(--red)':'var(--amber)'}},sentiment.value+' · '+sentiment.label)
    ):null,
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
      e('span',{style:{fontSize:12,color:'var(--text2)'}},'Combined strategy'),
      e('strong',{style:{fontFamily:'var(--mono)',color:c}},signal.direction)
    ),
    e('div',{style:{fontSize:11,color:'var(--text2)',lineHeight:1.5,marginBottom:8}},signal.reason),
    e('div',{style:{display:'flex',gap:5,flexWrap:'wrap',marginBottom:10}},
      ...(signal.evidence||[]).slice(0,5).map((x,i)=>e('span',{key:i,style:{fontSize:9,padding:'4px 6px',borderRadius:5,background:'var(--glass2)',color:'var(--text3)'}},x))
    ),
    e('div',{style:{display:'flex',gap:7,marginBottom:7}},
      e('button',{className:'btn btn-primary',style:{flex:1},onClick:()=>run(pair),disabled:busy},busy?'Updating…':'↻ Evaluate '+label),
      e('button',{className:'btn',style:{flex:1},onClick:paperTrade,disabled:signal.direction==='NO TRADE'||signal.pair!==pair},'Open Paper Trade')
    ),
    e('button',{className:'btn',style:{width:'100%',marginBottom:9},onClick:runScan,disabled:scanning},scanning?'Scanning watchlist…':'⌕ Scan Watchlist ('+PAPER_CONFIG.watchlist.length+' pairs)'),
    (scan.results||[]).length>0?e('div',{style:{marginBottom:9}},
      e('div',{style:{fontSize:9,color:'var(--text3)',marginBottom:5,letterSpacing:.5}},'RANKED OPPORTUNITIES'),
      ...scan.results.slice(0,3).map((r,i)=>e('div',{key:i,onClick:()=>r.ok&&focusPair(r.pair),
        style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 8px',
          background:'var(--glass2)',borderRadius:6,marginBottom:4,fontSize:10,cursor:r.ok?'pointer':'default',opacity:r.ok?1:.55}},
        e('span',null,r.label||r.pair),
        e('span',{style:{fontFamily:'var(--mono)',color:r.direction==='BUY'?'var(--green)':r.direction==='SELL'?'var(--red)':'var(--text3)'}},
          r.ok?(r.direction+' · '+r.confidence+'%'):'unavailable')
      ))
    ):null,
    e('label',{style:{display:'flex',alignItems:'center',gap:8,fontSize:10,color:'var(--text3)',marginTop:2}},
      e('input',{type:'checkbox',checked:auto,onChange:ev=>setAuto(ev.target.checked)}),
      'Auto-refresh every 5 minutes (paper evaluation + real stop/target checks only)'
    ),
    e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:8,lineHeight:1.4}},
      'Risk: 1%/trade · Daily loss: 3% · Max open: 1 · Circuit breaker: 3 losses · Leverage: 0×. No API keys and no real orders. Open paper trades close only at real stop/target prices — never simulated.'
    )
  );
}

// Maps a raw trader_signals row (written by the signal-scan cron) onto the
// shape the Signal Desk UI was originally built around, so the existing
// SigCard rendering keeps working unchanged.
function zsSignalTF(seconds){
  const map={60:'M1',300:'M5',900:'M15',1800:'M30',3600:'H1',14400:'H4',86400:'D1'};
  return map[seconds]||(seconds?Math.round(seconds/60)+'m':'H1');
}
function zsPairAsset(pair){
  if(pair==='XBTZAR')return 'BTC';
  if(pair==='ETHZAR')return 'ETH';
  if(pair==='XRPZAR')return 'XRP';
  if(pair==='LTCZAR')return 'LTC';
  return pair;
}
// Human-readable "how long was this trade open" — used on Closed Trade cards.
function zsFmtDuration(ms){
  if(!Number.isFinite(ms)||ms<0)return '—';
  const m=Math.round(ms/60000);
  if(m<1)return '<1m';
  if(m<60)return m+'m';
  const h=Math.floor(m/60),rm=m%60;
  if(h<24)return h+'h'+(rm?' '+rm+'m':'');
  const d=Math.floor(h/24),rh=h%24;
  return d+'d'+(rh?' '+rh+'h':'');
}
// A closed trade's exit trigger, normalised into 3 buckets for grouping/pills.
function zsExitBucket(t){
  const trig=String(t.trigger||'').toLowerCase();
  if(trig==='take-profit'||trig.includes('take-profit'))return 'tp';
  if(trig==='stop-loss'||trig.includes('stop-loss'))return 'sl';
  return 'manual';
}
// Saves a close to Supabase, then rebuilds the account balance from the sum of ALL closed trades
// (never from local arithmetic), so a bad local balance can no longer be written back to the server.
function zsSettleClose(trade,setAccount){
  const db=window.ZuShePaperDB; if(!db)return;
  Promise.resolve(db.closeTrade?.(trade)).then(()=>db.recomputeAccount?.()).then(r=>{
    if(r&&Number.isFinite(Number(r.balance))){
      const b=Number(r.balance);
      setAccount(a=>({...a,balance:b,equity:b,dailyPL:Number(r.daily_pnl)||0}));
    }
  }).catch(err=>console.warn('[ZuShé Trader] settle close failed:',err?.message||err));
}
function zsRowToPos(t){
  return {id:'PT-'+String(t.id).slice(0,8),dbId:t.id,pair:t.pair,market:zsPairAsset(t.pair),dir:t.direction,entry:Number(t.entry_price),sl:Number(t.stop_price),tp:Number(t.take_profit),size:Number(t.quantity),risk:Number(t.risk_amount),strategy:t.strategy,strat:t.strategy,confidence:Number(t.metadata&&t.metadata.confidence)||0,openedAt:Date.parse(t.entry_time)||Date.now(),paper:true};
}
function zsRowToClosed(t){
  const pl=Number(t.net_pnl)||0;
  const grossPl=t.gross_pnl!=null?Number(t.gross_pnl):pl;
  const fee=Number(t.fees)||0;
  const slip=Number(t.slippage_cost)||0;
  return {...zsRowToPos(t),exit:Number(t.exit_price)||0,pl,grossPl,fee,slip,closeTime:t.exit_time,status:pl>=0?'Win':'Loss',trigger:t.exit_reason||'Closed'};
}
function zsIsVoided(t){return String(t.exit_reason||'').startsWith('Voided');}
// ── FEE / SLIPPAGE MODEL (client side — mirrors paper-exit-check edge function) ──
// Luno's standard tier: maker 0%, taker 0.10% (drops to 0.03% at high 30-day
// volume) — https://www.luno.com/fees. We assume both legs of a paper trade
// are taker fills (entry on signal, exit on trigger/manual) and charge the
// round-trip fee at close, since that is when the real total is known.
// A manual close uses a live price already, so it only needs a fee + a small
// spread estimate — not the bigger stop-loss slippage below (that model is
// for TP/SL, which is only realistic to simulate server-side).
const ZS_FEE_MODEL={takerFeeRate:0.001,manualSpreadBps:6};
function zsRoundPrice(p){p=Number(p)||0;if(p<1)return Number(p.toFixed(6));if(p<100)return Number(p.toFixed(4));return Number(p.toFixed(2));}
function zsRoundTripFee(entryPrice,exitPrice,qty){return Number(((Number(entryPrice)*qty+Number(exitPrice)*qty)*ZS_FEE_MODEL.takerFeeRate).toFixed(2));}
// The "unrealized" figure shown on an open position must match what closePosition()
// will actually book if you tap Close Now right now. It used to show raw
// (last-entry)*size with no spread/fee taken off, so a real paper trade could show
// "+R8.25 unrealized" and then close at a loss once the ~0.2% round-trip taker fee
// (charged on notional, so it can dwarf a small gross move) and the manual-close
// spread estimate were subtracted. Mirror the exact same math here, and expose the
// gross/fee/net breakdown too so the card can show its working, not just a number.
function zsUnrealizedBreakdown(pos,lastPx){
  if(!lastPx||!pos.entry)return null;
  if(pos.paper){
    const spreadAdj=1+(ZS_FEE_MODEL.manualSpreadBps/10000)*(pos.dir==='BUY'?-1:1);
    const exitPrice=zsRoundPrice(lastPx*spreadAdj);
    const gross=parseFloat(((pos.dir==='BUY'?(exitPrice-pos.entry):(pos.entry-exitPrice))*(pos.size||0)).toFixed(2));
    const fee=zsRoundTripFee(pos.entry,exitPrice,pos.size||0);
    const net=parseFloat((gross-fee).toFixed(2));
    return {gross,fee,net,exitPrice};
  }
  const gross=parseFloat(((pos.dir==='BUY'?(lastPx-pos.entry):(pos.entry-lastPx))*(pos.size||0)).toFixed(2));
  return {gross,fee:0,net:gross,exitPrice:lastPx};
}
function zsUnrealizedPl(pos,lastPx){
  const b=zsUnrealizedBreakdown(pos,lastPx);
  return b?b.net:null;
}
// Real equity curve from closed trades (oldest first), ending at live equity.
function zsEquityCurve(account,equity){
  const closed=(account.closedTrades||[]).filter(t=>t.closeTime&&t.status!=='Void').slice().sort((a,b)=>new Date(a.closeTime)-new Date(b.closeTime));
  const seed=Number(account.starting_balance)||DEMO_ACCOUNT_SEED.balance;
  let bal=seed;const pts=[seed];
  closed.forEach(t=>{bal+=Number(t.pl)||0;pts.push(parseFloat(bal.toFixed(2)));});
  pts.push(equity);
  return pts.slice(-60);
}
function mapDbSignalToUi(row,account){
  const wl=PAPER_CONFIG.watchlist.find(w=>w.id===row.pair);
  const entry=Number(row.entry_price)||0,sl=Number(row.stop_price)||0,tp=Number(row.take_profit)||0;
  const rr=Math.abs(sl-entry)>0?Math.abs(tp-entry)/Math.abs(sl-entry):0;
  const size=paperPositionSize((account&&account.balance)||PAPER_CONFIG.startingBalance,entry,sl);
  const statusMap={pending:'Pending',accepted:'Accepted',watching:'Watching',rejected:'Rejected',expired:'Rejected'};
  return {
    id:row.id,
    pair:row.pair,
    market:wl?wl.label:row.pair,
    dir:row.direction,
    entry,sl,tp,rr,
    risk:(PAPER_CONFIG.riskPerTrade*100)+'%',
    size:size?size.toFixed(6)+' '+zsPairAsset(row.pair):'—',
    conf:Number(row.confidence)||0,
    strat:row.strategy,
    tf:zsSignalTF(row.timeframe),
    status:statusMap[row.status]||'Pending',
    time:row.created_at?new Date(row.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'',
    reasoning:(row.reason||'')+(Array.isArray(row.evidence)&&row.evidence.length?' — '+row.evidence.join('; '):''),
    overfit:null,
    reason:row.decision_reason||'',
    source:row.source||'ai_scan',
    tradable:!(row.source_meta&&row.source_meta.tradable===false),
    channel:(row.source_meta&&row.source_meta.channel_or_author)||''
  };
}

function SignalDesk({signals,setSignals,account,setAccount,showToast,riskSettings,refreshSignals,signalsLoading,livePrices}){
  const[tab,setTab]=useState('pending');
  const[showRej,setShowRej]=useState(null);
  const[rejReason,setRejReason]=useState('');
  const[showDetail,setShowDetail]=useState(null);

  const[srcTab,setSrcTab]=useState('all');
  const[tgLabel,setTgLabel]=useState('');
  const[tgBusy,setTgBusy]=useState(false);
  const fileRef=useRef(null);
  const bySource=srcTab==='all'?signals:signals.filter(s=>(s.source||'ai_scan')===srcTab);
  const pending=bySource.filter(s=>s.status==='Pending');
  const accepted=bySource.filter(s=>s.status==='Accepted');
  const rejected=bySource.filter(s=>s.status==='Rejected');
  const watching=bySource.filter(s=>s.status==='Watching');

  // An "Accepted" signal can now be in one of four real states — split it
  // by cross-referencing the signal id against the live open positions and
  // closed trades, rather than leaving everything lumped under one label.
  const openSigIds=useMemo(()=>new Set((account.openPositions||[]).filter(p=>p.sigId).map(p=>p.sigId)),[account.openPositions]);
  const closedSigBucket=useMemo(()=>{
    const m={};
    (account.closedTrades||[]).forEach(t=>{ if(t.sigId&&!(t.sigId in m))m[t.sigId]=zsExitBucket(t); });
    return m;
  },[account.closedTrades]);
  const acceptedOpen=accepted.filter(s=>openSigIds.has(s.id)||!(s.id in closedSigBucket));
  const acceptedClosedTp=accepted.filter(s=>closedSigBucket[s.id]==='tp');
  const acceptedClosedSl=accepted.filter(s=>closedSigBucket[s.id]==='sl');
  const acceptedClosedManual=accepted.filter(s=>closedSigBucket[s.id]==='manual');

  // Downscale to max 1600px JPEG so phone screenshots stay well under API/body limits.
  const fileToBase64=(file)=>new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const maxDim=1600,k=Math.min(1,maxDim/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve({base64:c.toDataURL('image/jpeg',0.85).split(',')[1],mediaType:'image/jpeg'});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not read that image.'));};
    img.src=url;
  });
  const onPickTelegram=async(ev)=>{
    const file=ev.target.files&&ev.target.files[0];
    ev.target.value='';
    if(!file)return;
    if(!window.ZuShePaperDB?.submitTelegramSignal){showToast('Signal parser not ready yet — try again in a moment.','warning');return;}
    setTgBusy(true);
    try{
      const {base64,mediaType}=await fileToBase64(file);
      const r=await window.ZuShePaperDB.submitTelegramSignal(base64,mediaType,tgLabel.trim()||'telegram');
      if(r&&r.error){showToast(r.error,'warning');}
      else{
        showToast('📨 Screenshot parsed — signal added to Pending','success');
        setTab('pending');
        refreshSignals&&refreshSignals();
      }
    }catch(err){showToast((err&&err.message)||'Upload failed','warning');}
    setTgBusy(false);
  };

  useEffect(()=>{ refreshSignals&&refreshSignals(); },[]);

  // Accepting now opens a REAL paper position through the same path the
  // Paper Engine card uses (window.ZuShePaperDB.openTrade) — it lands in
  // trader_paper_trades and paper-exit-check will close it against live
  // Luno prices, exactly like a Combined-strategy trade.
  const acceptSig=(sig)=>{
    if(sig.dir==='NO TRADE'){showToast('This is not a real setup — nothing to accept.','info');return;}
    if(sig.tradable===false){showToast(sig.pair+' has no live price feed, so it cannot auto-close as a paper trade. Use Watch Only to track it manually.','info');return;}
    if(account.openPositions.length>=riskSettings.maxOpenTrades){
      showToast('Max open trades ('+riskSettings.maxOpenTrades+') already reached. Close a position first.','warning');return;
    }
    const risk=parseFloat((paperSizingBalance(account.balance)*PAPER_CONFIG.riskPerTrade).toFixed(2));
    const size=paperPositionSize(account.balance,sig.entry,sig.sl);
    const pos={id:'PT-'+Date.now(),dbId:zsGenId(),pair:sig.pair,dir:sig.dir,entry:sig.entry,sl:sig.sl,tp:sig.tp,size,risk,strategy:sig.strat,confidence:sig.conf,openedAt:Date.now(),paper:true,sigId:sig.id};
    setSignals(ss=>ss.map(s=>s.id===sig.id?{...s,status:'Accepted'}:s));
    setAccount(a=>({...a,openPositions:[...a.openPositions,pos],used:parseFloat((a.used+risk).toFixed(2))}));
    window.ZuShePaperDB?.openTrade?.(pos)?.catch?.(()=>{});
    window.ZuShePaperDB?.decideSignal?.(sig.id,'accepted')?.catch?.(()=>{});
    showToast('✅ Signal accepted — real paper position opened on '+sig.market,'success');
    setShowDetail(null);
  };

  // Accept every pending, tradable signal in one go (up to the open-trade limit) so many
  // paper trades can run side by side and be compared by strategy / timeframe / pair.
  const acceptAllPending=()=>{
    const cand=pending.filter(s=>s.dir!=='NO TRADE'&&s.tradable!==false);
    if(!cand.length){showToast('No tradable pending signals to accept.','info');return;}
    const room=Math.max(0,riskSettings.maxOpenTrades-account.openPositions.length);
    const chosen=cand.slice(0,room);
    if(!chosen.length){showToast('Max open trades ('+riskSettings.maxOpenTrades+') already reached. Close a position first.','warning');return;}
    const skippedN=cand.length-chosen.length;
    if(!window.confirm('Open '+chosen.length+' paper trade'+(chosen.length>1?'s':'')+' now?'+(skippedN?'\n('+skippedN+' more will stay pending — open-trade limit reached.)':'')+'\n\nEach risks '+(PAPER_CONFIG.riskPerTrade*100)+'% of your paper balance.'))return;
    const now=Date.now();
    const perRisk=parseFloat((paperSizingBalance(account.balance)*PAPER_CONFIG.riskPerTrade).toFixed(2));
    const newPos=chosen.map((sig,i)=>({id:'PT-'+(now+i),dbId:zsGenId(),pair:sig.pair,dir:sig.dir,entry:sig.entry,sl:sig.sl,tp:sig.tp,size:paperPositionSize(account.balance,sig.entry,sig.sl),risk:perRisk,strategy:sig.strat,confidence:sig.conf,openedAt:now+i,paper:true,sigId:sig.id}));
    const ids=new Set(chosen.map(s=>s.id));
    setSignals(ss=>ss.map(s=>ids.has(s.id)?{...s,status:'Accepted'}:s));
    setAccount(a=>({...a,openPositions:[...a.openPositions,...newPos],used:parseFloat((a.used+perRisk*newPos.length).toFixed(2))}));
    newPos.forEach(pos=>{
      window.ZuShePaperDB?.openTrade?.(pos)?.catch?.(()=>{});
      window.ZuShePaperDB?.decideSignal?.(pos.sigId,'accepted')?.catch?.(()=>{});
    });
    showToast('✅ Opened '+newPos.length+' paper trade'+(newPos.length>1?'s':''),'success');
  };

  const rejectSig=(sig,reason)=>{
    setSignals(ss=>ss.map(s=>s.id===sig.id?{...s,status:'Rejected',reason}:s));
    window.ZuShePaperDB?.decideSignal?.(sig.id,'rejected',reason)?.catch?.(()=>{});
    showToast('Signal rejected and logged','info');
    setShowRej(null);setRejReason('');setShowDetail(null);
  };

  const watchSig=(sig)=>{
    setSignals(ss=>ss.map(s=>s.id===sig.id?{...s,status:'Watching'}:s));
    window.ZuShePaperDB?.decideSignal?.(sig.id,'watching')?.catch?.(()=>{});
    showToast('Added to watchlist — ZuShé will track whether this would have won or lost','info');
    setShowDetail(null);
  };

  const tabs=[
    {id:'pending',lbl:'Pending',cnt:pending.length,desc:'Waiting for your decision'},
    {id:'open',lbl:'Open',cnt:acceptedOpen.length,desc:'Accepted and still running'},
    {id:'closedTp',lbl:'Closed · TP',cnt:acceptedClosedTp.length,desc:'Closed by take-profit'},
    {id:'closedSl',lbl:'Closed · SL',cnt:acceptedClosedSl.length,desc:'Closed by stop-loss'},
    {id:'closedManual',lbl:'Closed · Manual',cnt:acceptedClosedManual.length,desc:'You closed these yourself'},
    {id:'watching',lbl:'Watching',cnt:watching.length,desc:'Monitoring outcome without a position'},
    {id:'rejected',lbl:'Rejected',cnt:rejected.length,desc:'You declined these signals'},
  ];
  const list={pending,open:acceptedOpen,closedTp:acceptedClosedTp,closedSl:acceptedClosedSl,closedManual:acceptedClosedManual,watching,rejected}[tab]||[];

  const SigCard=({sig,livePrice})=>e('div',{className:'sig-card sig-'+sig.dir.toLowerCase()},
    e('div',{className:'sig-accent'}),
    e('div',{className:'sig-body'},
      // Header
      e('div',{className:'row',style:{marginBottom:10}},
        e('div',null,
          e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:2}},
            e('span',{className:'pill '+(sig.dir==='BUY'?'pill-buy':'pill-sell')},
              sig.dir==='BUY'?'▲ BUY':'▼ SELL'
            ),
            e('span',{style:{fontWeight:800,fontSize:16}},sig.market)
          ),
          e('div',{style:{fontSize:11,color:'var(--text3)'}},
            sig.source==='telegram'?('📨 Telegram'+(sig.channel?' · '+sig.channel:'')+(sig.tradable===false?' · manual track only':'')):(sig.strat+' · '+sig.tf+' chart'),' · Signal at ',sig.time
          )
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--cyan)',marginBottom:2}},sig.source==='telegram'?'PARSE CONFIDENCE':'AI CONFIDENCE'),
          e('div',{style:{fontFamily:'var(--mono)',fontWeight:800,fontSize:20,color:sig.conf>79?'var(--green)':sig.conf>65?'var(--cyan)':'var(--amber)'}},sig.conf+'%'),
          e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:1}},sig.conf>79?'High confidence':sig.conf>65?'Moderate confidence':'Lower confidence')
        )
      ),
      // Confidence bar
      e('div',{style:{marginBottom:12}},
        e('div',{className:'conf-wrap'},e('div',{className:'conf-fill',style:{width:sig.conf+'%'}}))
      ),
      // Price levels
      e('div',{style:{background:'var(--glass)',borderRadius:10,padding:'10px 12px',marginBottom:10}},
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginBottom:8}},'PRICE LEVELS — WHERE TO ENTER, EXIT, AND STOP'),
        e('div',{style:{textAlign:'center',marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--border)'}},
          e('div',{style:{fontSize:9,color:'var(--cyan)',marginBottom:3}},'CURRENT PRICE'),

          e('div',{style:{fontSize:9,color:'var(--text3)',marginTop:2}},livePrice!=null?'Live from Luno · updates every 60s':'Waiting for a live price…')

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}},

// Must match MIN_SAMPLE_FOR_EVOLUTION in the evolution-engine edge function.
const EVO_MIN_TRADES=5;
function EvolutionLab({showToast}){
  const[tab,setTab]=useState('strategies');
  const[pool,setPool]=useState([]);
  const[evoAccount,setEvoAccount]=useState(null);
  const[evoTrades,setEvoTrades]=useState([]);
  const[poolLoading,setPoolLoading]=useState(false);
  const[evoLivePrice,setEvoLivePrice]=useState(null);
  const[running,setRunning]=useState(false);
  const[runResult,setRunResult]=useState(null);

  const loadReal=useCallback(async()=>{
    if(!window.ZuShePaperDB)return;
    setPoolLoading(true);
    try{
      const[p,a,t]=await Promise.all([
        window.ZuShePaperDB.loadStrategyPool(),
        window.ZuShePaperDB.loadEvolutionAccount(),
        window.ZuShePaperDB.loadEvolutionTrades()
      ]);
      setPool(p||[]); setEvoAccount(a||null); setEvoTrades(t||[]);
    }catch(err){
      console.warn('[ZuShé Trader] could not load evolution data:',err);
    }finally{
      setPoolLoading(false);
    }
  },[]);

  useEffect(()=>{
    let cancelled=false,tries=0;
    const iv=setInterval(()=>{
      tries++;
      if(cancelled)return;
      if(window.ZuShePaperDB||tries>20){
        clearInterval(iv);
        loadReal();
      }
    },150);
    return()=>{cancelled=true;clearInterval(iv);};
  },[loadReal]);

  // The evolution account only ever trades XBTZAR, so a single ticker
  // poll covers every open position it could be holding.
  useEffect(()=>{
    const hasOpen=evoTrades.some(t=>t.status==='OPEN');
    if(!hasOpen)return;
    let cancelled=false;
    const poll=async()=>{
      try{
        const t=await DataProviders.luno.getTicker('XBTZAR');
        const last=Number(t.last_trade||t.last||0);
        if(!cancelled&&last>0)setEvoLivePrice(last);
      }catch(_e){/* keep last known price on a transient failure */}
    };
    poll();
    const iv=setInterval(poll,60000);
    return()=>{cancelled=true;clearInterval(iv);};
  },[evoTrades]);

  const openByStrategy=useMemo(()=>{
    const m={};
    evoTrades.filter(t=>t.status==='OPEN').forEach(t=>{m[t.strategy]=t;});
    return m;
  },[evoTrades]);

  const evoUnrealized=useMemo(()=>{
    return evoTrades.filter(t=>t.status==='OPEN').reduce((sum,t)=>{
      if(!evoLivePrice||!t.entry_price)return sum;
      const pl=(t.direction==='BUY'?(evoLivePrice-t.entry_price):(t.entry_price-evoLivePrice))*Number(t.quantity||0);
      return sum+pl;
    },0);
  },[evoTrades,evoLivePrice]);

  const evoEquity=evoAccount?Number(evoAccount.balance)+evoUnrealized:null;
  const evoReturn=evoAccount?((Number(evoAccount.balance)-Number(evoAccount.starting_balance||10000))/Number(evoAccount.starting_balance||10000)*100):0;

  const runEvolutionNow=async()=>{
    setRunning(true); setRunResult(null);
    try{
      const res=await window.ZuShePaperDB.runEvolutionEngine();
      setRunResult(res);
      // The edge function's own placeholder is the literal string 'no'
      // (not null/empty) when nothing was skipped — only treat it as a
      // real skip reason otherwise.
      const realSkip=res.skipped&&res.skipped!=='no'?res.skipped:null;
      const msg=realSkip?('Cycle ran — '+realSkip)
        :res.evolved?('Evolved: retired '+res.evolved.retired+', spawned '+(res.evolved.spawned||'a new genome')+' from '+res.evolved.spawnedFrom)
        :(res.opened&&res.opened.length)?(res.opened.length+' new position(s) opened')
        :'Cycle complete, no changes this run';
      showToast(msg,'success');
      await loadReal();
    }catch(err){
      showToast('Evolution run failed: '+(err?.message||'unknown error'),'error');
    }finally{
      setRunning(false);
    }
  };

  const activeCount=pool.filter(g=>g.status==='active').length;
  const readyCount=pool.filter(g=>g.status==='active'&&g.trades_closed>=EVO_MIN_TRADES).length;

  return e('div',{className:'screen'},
    e('div',{className:'hdr'},
      e('div',null,
        e('div',{style:{fontSize:16,fontWeight:800}},e('span',{style:{color:'var(--cyan)'}},'>_ '),'Evolution Engine'),
        e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1.5,marginTop:1}},'YOUR REAL AUTONOMOUS STRATEGY POOL')
      )
    ),
    e('div',{className:'scroll'},
      e('div',{className:'tabs',style:{paddingTop:10}},
        [['strategies','My Strategies'],['run','Run Evolution'],['scoring','How Scoring Works']].map(([id,lbl])=>
          e('button',{key:id,className:'tab '+(tab===id?'on':''),onClick:()=>setTab(id)},lbl)
        )
      ),

      // ── STRATEGIES TAB (real trader_strategy_pool data) ──
      tab==='strategies'&&e('div',null,
        e('div',{className:'info-banner',style:{marginTop:4}},
          e('span',null,'🧬'),
          e('div',null,
            e('div',{style:{fontWeight:700,marginBottom:2}},'What is a Strategy?'),
            'These are the actual genomes your evolution engine is running server-side, on their own R10,000 sandbox account, against live BTC, ETH, XRP and LTC (vs ZAR) 15-minute data — separate from your R10,000 demo account. A genome needs '+EVO_MIN_TRADES+' closed trades before it can be retired or bred.'
          )
        ),

        evoAccount&&e('div',{className:'card',style:{marginBottom:14}},
          e('div',{style:{fontFamily:'var(--mono)',fontSize:9,color:'var(--cyan)',letterSpacing:2,marginBottom:10}},'EVOLUTION ACCOUNT — SEPARATE FROM YOURS'),
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
            e('div',null,
              e(HelpLabel,{label:'Equity',help:'Starting balance plus or minus unrealized P/L on any open positions, live.'}),
              e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:15,color:'var(--cyan)',marginTop:2}},fmtCur(evoEquity!=null?evoEquity:Number(evoAccount.balance))),
              e('div',{style:{fontSize:10,color:evoReturn>=0?'var(--green)':'var(--red)',marginTop:1}},(evoReturn>=0?'▲ +':'▼ ')+Math.abs(evoReturn).toFixed(2)+'% from start')
            ),
            e('div',null,
              e(HelpLabel,{label:'Open Positions',help:'How many genomes currently have a live BTC/ZAR paper position open.'}),
              e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:15,marginTop:2}},evoTrades.filter(t=>t.status==='OPEN').length),
              evoUnrealized!==0&&e('div',{style:{fontSize:10,color:evoUnrealized>=0?'var(--green)':'var(--red)',marginTop:1}},(evoUnrealized>=0?'+':'')+fmtCur(evoUnrealized)+' unrealized')
            )
          )
        ),

        poolLoading&&pool.length===0
          ?e('div',{className:'empty'},e('div',{className:'spinner'}),e('div',{className:'empty-sub',style:{marginTop:8}},'Loading your real strategy pool from Supabase…'))
          :pool.length===0
          ?e('div',{className:'empty'},e('div',{className:'empty-icon'},'🧬'),e('div',{className:'empty-title'},'No strategies found'),e('div',{className:'empty-sub'},'Could not reach the evolution account — check your connection, or go to "Run Evolution" to trigger a cycle.'))
          :pool.map(g=>{
              const openTrade=openByStrategy[g.name];
              const tradePl=openTrade&&evoLivePrice&&openTrade.entry_price
                ?(openTrade.direction==='BUY'?(evoLivePrice-openTrade.entry_price):(openTrade.entry_price-evoLivePrice))*Number(openTrade.quantity||0)
                :null;
              const fit=Number(g.score||0);
              const fitColor=fit>=0.8?'var(--green)':fit>=0.4?'var(--amber)':g.trades_closed>0?'var(--red)':'var(--text3)';
              return e('div',{key:g.id,className:'strat-card'},
                e('div',{className:'row',style:{marginBottom:6}},
                  e('div',null,
                    e('div',{style:{fontWeight:700,fontSize:14}},g.name),
                    e('div',{style:{fontSize:11,color:'var(--text3)',marginTop:2}},g.family+' · Gen '+g.generation+' · BTC/ZAR · H1')
                  ),
                  e('div',{style:{background:fitColor+'18',color:fitColor,border:'1px solid '+fitColor+'40',borderRadius:8,padding:'3px 9px',fontSize:11,fontWeight:700,fontFamily:'var(--mono)',flexShrink:0}},
                    g.trades_closed>=EVO_MIN_TRADES?('Fitness '+fit.toFixed(2)):(g.trades_closed+'/'+EVO_MIN_TRADES+' trades'))
                ),
                e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:6,marginBottom:10}},
                  ...[
                    {l:'Win Rate',v:(g.win_rate||0)+'%',c:'var(--green)',tip:'Of the '+g.trades_closed+' real closed trades this genome has taken, '+(g.win_rate||0)+'% were profitable.'},
                    {l:'Avg R:R',v:(g.avg_rr||0).toFixed(2),c:'var(--cyan)',tip:'Average win size divided by average loss size, across this genome real closed trades.'},
                    {l:'Net P/L',v:fmtCur(g.net_pnl||0),c:(g.net_pnl||0)>=0?'var(--green)':'var(--red)',tip:'Total realized profit or loss from this genome real closed trades on the R10,000 evolution account.'},
                    {l:'Trades Closed',v:g.trades_closed||0,c:'var(--text2)',tip:'How many real trades this genome has actually completed. Needs 15 before it can be scored, retired, or bred from.'},

                    e('div',{key:l,style:{background:'var(--glass)',borderRadius:8,padding:'6px 8px',textAlign:'center'}},
                      e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:c}},v),

                openTrade&&e('div',{style:{background:'var(--glass)',borderRadius:8,padding:'8px 10px',marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center'}},
                  e('div',null,
                    e('span',{className:'pill '+(openTrade.direction==='BUY'?'pill-buy':'pill-sell')},openTrade.direction==='BUY'?'▲ BUY':'▼ SELL'),
                    e('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:6}},'open now at '+fmtCur(openTrade.entry_price))
                  ),
                  tradePl!=null&&e('div',{style:{fontFamily:'var(--mono)',fontWeight:700,fontSize:12,color:tradePl>=0?'var(--green)':'var(--red)'}},(tradePl>=0?'+':'')+fmtCur(tradePl))
                ),
                e('div',{className:'row'},
                  e('div',null,
                    e('span',{className:'live-dot',style:{background:g.status==='active'?'var(--green)':'var(--red)'}}),
                    e('span',{style:{fontSize:11,color:g.status==='active'?'var(--green)':'var(--red)',fontWeight:700,textTransform:'capitalize'}},g.status),
                    e('span',{style:{fontSize:10,color:'var(--text3)',marginLeft:6}},g.status==='active'?'— competing in the live pool':'— retired '+(g.retired_at?new Date(g.retired_at).toLocaleDateString():''))

                  g.parent_id&&e('span',{style:{fontSize:10,color:'var(--text3)',fontFamily:'var(--mono)'}},'bred from parent')
                ),
                g.notes&&e('div',{style:{fontSize:10,color:'var(--text3)',marginTop:8,lineHeight:1.5,fontStyle:'italic'}},g.notes)
              );
            }),

        activeCount>0&&e('div',{style:{fontSize:10,color:'var(--text3)',textAlign:'center',marginTop:4}},
          readyCount+' of '+activeCount+' active genomes have reached '+EVO_MIN_TRADES+' closed trades — evolution (retire weakest, breed from best) happens automatically once all of them do.')
      ),

          e('span',null,'🧬'),
          e('div',null,
            e('div',{style:{fontWeight:700,marginBottom:2}},'How the real Evolution Engine works'),

        e('div',{className:'card'},

          pool.length===0

            :e('div',{style:{fontSize:12,color:'var(--text2)',lineHeight:1.8}},
